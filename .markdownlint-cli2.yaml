# Markdown guardrails for Lakekeeper.
#
# This is a LINTER, not a formatter. It enforces structural correctness (blank
# lines around headings/lists/fences, list nesting, trailing newlines) and
# deliberately says nothing about line width, table alignment or prose layout.
# Those are chosen by hand for human readability and must survive a round trip
# through any editor.
#
# Read by markdownlint-cli2 and by the VS Code markdownlint extension, which
# uses identical config discovery.
#
# NOTE: markdownlint-cli2 resolves this file relative to the working directory
# and does NOT walk up the tree. Run it from the repository root, and open your
# editor at the repository root, or the defaults apply instead.

globs:
  - "**/*.md"

ignores:
  - "**/CHANGELOG.md" # generated by release-please
  - "**/node_modules/**"
  - "**/target/**"
  - "**/site/site/**" # mkdocs build output
  - "**/docs/site/**"
  - "**/.venv/**"

config:
  # --- Disabled: conflicts with deliberate authoring style ----------------

  # Docs prose is one line per paragraph, no hard wrapping (see AGENTS.md).
  # Soft-wrap is the reader's job, not the file's.
  MD013: false

  # Tables are hand-aligned for readability and several have a wide free-text
  # column. Every available style is worse than leaving them alone: measured
  # against these docs, "any" (the default) still flags 732 rows, "aligned"
  # 999, "compact" 1816, "tight" 4648 -- because columns are padded
  # inconsistently *within* a single table, on purpose.
  MD060: false

  # MkDocs Material needs inline HTML: <nobr> in config tables,
  # <span class="lkp">, <details>, and <img> inside headings.
  MD033: false

  # Indented code blocks appear inside `=== "Tab"` content tabs and `!!!`
  # admonitions, which markdownlint cannot distinguish from plain indented
  # code. Unfixable false positive by construction.
  MD046: false

  # Release-notes and API pages legitimately repeat headings across versions.
  MD024:
    siblings_only: true

  # README.md uses multiple top-level headings as section dividers.
  MD025: false

  # Not every file starts with an H1; MkDocs supplies titles from the nav.
  MD041: false

  # Bold-as-pseudo-heading is used intentionally in docs.
  MD036: false

  # Anchor validity is already checked authoritatively by lychee in CI
  # (`cd site && just linkcheck` -- the recipe lives in site/justfile, not the
  # root one). markdownlint's slugger disagrees with MkDocs on
  # headings containing emoji or inline HTML -- e.g. `## <img ...> Spark`,
  # where MkDocs strips the tag and markdownlint does not -- so this rule
  # produces only false positives here.
  MD051: false

  # Deleting "unused" link reference definitions is a content-destroying
  # autofix, and it misfires inside indented admonition bodies. Keep --fix
  # purely cosmetic.
  MD053: false

  # --- Tuned rather than disabled -----------------------------------------

  # python-markdown (MkDocs) requires 4-space indentation for nested lists.
  MD007:
    indent: 4

  # Per-file consistency rather than a repo-wide bullet character, so the 14
  # files using `*` are not rewritten.
  MD004:
    style: consistent

  # Allow both `1. 1. 1.` and `1. 2. 3.`.
  MD029:
    style: one_or_ordered
