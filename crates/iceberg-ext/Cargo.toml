[package]
name = "iceberg-ext"
version = { workspace = true }
edition = { workspace = true }
homepage = { workspace = true }
rust-version = { workspace = true }
repository = { workspace = true }
license = { workspace = true }

description = "Extensions for Apache Iceberg Rust"
keywords = ["iceberg", "rest", "extension"]

[lib]

[features]
all = ['axum']
axum = ['dep:axum']

[dependencies]
axum = { workspace = true, optional = true }
heck = { workspace = true }
http = { workspace = true }
iceberg = { workspace = true }
lakekeeper-io = { path = "../io", default-features = false }
pastey = { workspace = true }
serde = { workspace = true }
serde_derive = { workspace = true }
serde_json = { workspace = true, features = ["preserve_order"] }
strum_macros = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true, features = ["attributes", "valuable"] }
typed-builder = { workspace = true }
url = { workspace = true }
utoipa = { workspace = true }
uuid = { workspace = true, features = ["serde"] }
valuable = { workspace = true }

[dev-dependencies]
bytes = { workspace = true }
futures-util = { version = "^0.3" }
lakekeeper-io = { path = "../io", default-features = false, features = [
    "storage-in-memory",
] }
lazy_static = { workspace = true }
tokio = { workspace = true }

[lints.rust]
# See the `compile_error!` in src/lib.rs: `tracing_unstable` is set repo-wide in
# `.cargo/config.toml` and in CI. Declare it so the guard does not itself trip
# `unexpected_cfgs` under `-D warnings`.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(tracing_unstable)'] }
