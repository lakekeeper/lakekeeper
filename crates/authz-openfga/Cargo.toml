[package]
name = "lakekeeper-authz-openfga"
version = { workspace = true }
edition = { workspace = true }
homepage = { workspace = true }
rust-version = { workspace = true }
repository = { workspace = true }
license = { workspace = true }

description = "OpenFGA Authorizer for Lakekeeper"
keywords = ["iceberg", "rest", "lakekeeper", "openfga"]

[lib]

[features]
# Enable this whenever anything in the build enables `lakekeeper/open-api`, even
# indirectly. The coupling only runs one way: turning this on turns that on, but not the
# reverse. `Authorizer::api_doc` exists only under `lakekeeper/open-api` while the impl
# here is gated on this feature, so a build with that feature on and this one off leaves
# the trait unimplemented — a confusing "missing `api_doc`" error pointing at the impl
# rather than at the dependency edge that caused it. Cargo features cannot propagate
# upward, so this cannot be enforced here.
open-api = ["dep:utoipa", "lakekeeper/open-api"]
# Exposes fresh-store authorizer constructors for downstream integration tests
# (e.g. the OpenFGA+Postgres e2e harness in lakekeeper-integration-tests).
test-utils = []

[dependencies]
anyhow = { workspace = true }
chrono = { workspace = true }
figment = { workspace = true }
futures = { workspace = true }
http = { workspace = true }
lakekeeper = { path = "../lakekeeper", default-features = false }
openfga-client = { version = "0.6", features = [
    "auth-middle",
    "tls-rustls",
    "tls-webpki-roots",
    "tls-native-roots",
] }
serde = { workspace = true }
serde_json = { workspace = true }
strum = { workspace = true }
strum_macros = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
typed-builder = { workspace = true }
url = { workspace = true }
urlencoding = { workspace = true }
utoipa = { workspace = true, optional = true }
uuid = { workspace = true }
veil = { workspace = true }

[dev-dependencies]
fastrand = { workspace = true }
figment = { workspace = true, features = ["test"] }
itertools = { workspace = true }
lakekeeper = { path = "../lakekeeper", features = ["test-utils"] }
lakekeeper-integration-tests = { path = "../lakekeeper-integration-tests" }
lakekeeper-storage-postgres = { path = "../lakekeeper-storage-postgres" }
sqlx = { workspace = true, features = ["runtime-tokio", "postgres", "uuid"] }
tracing-test = { workspace = true }
