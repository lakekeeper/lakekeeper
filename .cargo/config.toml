[build]
rustflags = ["--cfg", "tracing_unstable", "--cfg", "tokio_unstable"]
# `rustflags` does not reach rustdoc, so doctests would be compiled without these cfgs
# and `#[cfg(not(tracing_unstable))] compile_error!` in the audit backend would fire
# during doctest collection. `RUSTDOCFLAGS` is unset in CI, so this applies there too.
rustdocflags = ["--cfg", "tracing_unstable", "--cfg", "tokio_unstable"]

# Force sqlx macros to read from `.sqlx/` instead of opening a DB connection per
# query when DATABASE_URL is set (e.g. via the workspace-root `.env`). `cargo sqlx
# prepare` explicitly sets SQLX_OFFLINE=false on its cargo subprocess
# (sqlx-cli prepare.rs), and cargo's [env] table defers to inherited values when
# `force = false` (the default), so `just sqlx-prepare` still regenerates the
# cache against the live database.
[env]
SQLX_OFFLINE = "true"

# Compile `thp:never` into jemalloc (applied as its `--with-malloc-conf`).
#
# Transparent huge pages defeat jemalloc's page release: it frees at 4 KiB
# granularity with MADV_DONTNEED, but a 2 MiB huge page cannot be partially
# freed, so one live page anywhere inside keeps all 2 MiB resident. On a node
# with THP=always (common on EKS AMIs) a replica's RSS ratchets up permanently
# and only a restart recovers it, while jemalloc's own `stats.resident`
# under-reports real residency because it tracks its logical 4 KiB view.
# Measured: AnonHugePages 286 MiB -> 0, settled RSS -68%, throughput +1.9%.
#
# A build variable, so the setting travels inside every binary built from this
# tree, including `cargo install` and direct `cargo build` runs. jemalloc reads
# `--with-malloc-conf` first and `MALLOC_CONF` last, so an operator can override
# it at runtime with `_RJEM_MALLOC_CONF`.
JEMALLOC_SYS_WITH_MALLOC_CONF = "thp:never"

# Build the vendored MIT krb5 1.19.2 (`krb5-src`, pulled in by rdkafka's
# `gssapi-vendored` feature) on GCC >= 15 and glibc >= 2.43.
#
# GCC 15 compiles C as C23 by default, where `int f()` declares a function that
# takes no arguments; krb5's K&R-style RPC code then fails with "too many
# arguments to function". `-std=gnu17` restores the default of GCC <= 14.
#
# glibc 2.43 makes `strchr` and similar functions return `const char *` for a
# `const char *` argument whenever `_GNU_SOURCE` is set, independent of `-std`.
# krb5 assigns such results to `char *` and builds with
# `-Werror=discarded-qualifiers`. krb5's configure adds its warning flags only
# when `WARN_CFLAGS` is unset, so setting it keeps those warnings non-fatal.
#
# Both are fixed upstream in krb5 1.22; remove these once `krb5-src` bundles it.
# A `CFLAGS` set in the environment replaces this value.
CFLAGS = "-std=gnu17"
WARN_CFLAGS = "-Wall"
