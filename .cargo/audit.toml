# See https://github.com/rustsec/rustsec/blob/main/cargo-audit/audit.toml.example
[advisories]
ignore = [
    "RUSTSEC-2023-0071", # https://github.com/RustCrypto/RSA/issues/19#issuecomment-1822995643
    "RUSTSEC-2024-0384", # instant unmaintained but no direct harm, resolved eventually by azure library updates to the new official SDK once SAS is supported.
    "RUSTSEC-2024-0436", # paste is unmaintained but has no direct harm. We already removed direct dependencies.
    "RUSTSEC-2026-0001", # Review once https://github.com/paupino/rust-decimal/issues/766 is merged
    "RUSTSEC-2025-0134", # https://github.com/nats-io/nats.rs/issues/1502, will be fixed in v0.47
    "RUSTSEC-2026-0194", # quick-xml <0.41 O(N²) attribute-parse DoS. Client-facing path (S3 remote-signer DeleteObjects body) is on the patched 0.41; only remaining instance is 0.40.1 via the azure_core 0.21 fork (ADLS), which parses Azure responses not attacker input. Remove when the azure fork bumps quick-xml to ≥0.41.
    "RUSTSEC-2026-0195", # quick-xml <0.41 NsReader namespace-declaration memory-exhaustion DoS. Same exposure/justification as RUSTSEC-2026-0194 — only remaining <0.41 instance is 0.40.1 via the azure_core 0.21 fork. Remove when the azure fork bumps quick-xml to ≥0.41.
    "RUSTSEC-2026-0367", # zip <9.0.0 keeps SUID/SGID bits on extract. Only a build-dependency of utoipa-swagger-ui; its build script copies unix modes itself, but only from the pinned Swagger UI release zip from GitHub, and the files are embedded as static assets, never executed. Remove when utoipa-swagger-ui moves to zip ≥9.0.0.
    "RUSTSEC-2026-0368", # zip <9.0.0 `extract` creates symlinks that point outside the target folder. Only a build-dependency of utoipa-swagger-ui, whose build script extracts entries itself via `enclosed_name()` and never creates symlinks. Remove when utoipa-swagger-ui moves to zip ≥9.0.0.
    "RUSTSEC-2026-0369", # zip <9.0.0 `extract` sets permissions through symlinks onto targets outside the folder. Only a build-dependency of utoipa-swagger-ui, whose build script never calls `extract` and creates no symlinks. Remove when utoipa-swagger-ui moves to zip ≥9.0.0.]
    "RUSTSEC-2026-0391", # zstd <0.14.3 `with_context` carries an abandoned stream into the next one. No dependency calls `Encoder::with_context` or `Decoder::with_context`. HTTP compression (tower-http) is on the patched 0.14.3; the remaining 0.13.3 comes from apache-avro 0.22, parquet 59 and the iceberg fork. Remove when they move to zstd ≥0.14.3.
    "RUSTSEC-2026-0398", # zstd-safe <8.2.0 `Seekable::decompress` sets a `Vec` length past its capacity. Only with the `seekable` feature, which no dependency enables. The remaining 7.2.4 comes with zstd 0.13.3. Remove with RUSTSEC-2026-0391.
    "RUSTSEC-2026-0403", # zstd-safe <8.2.0 `DCtx::decompress_stream` exposes uninitialized memory when a legacy frame fails. Reached through `zstd::stream::write::Decoder`; the zstd 0.13.3 users decode with the read `Decoder` (apache-avro), `decode_all` (iceberg) and the bulk API (parquet), which the advisory lists as not affected. Remove with RUSTSEC-2026-0391.
]
