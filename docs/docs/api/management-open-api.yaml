        - $ref: '#/components/schemas/UserOrRole'
        - type: object
          required:
            - type
          properties:
            type:
              type: string
              enum:
                - ownership
    RoleMember:
      oneOf:
        - $ref: '#/components/schemas/RoleMemberUser'
        - $ref: '#/components/schemas/RoleMemberRole'
      description: |-
        A member of a role, returned by `GET /role/{id}/members`. Discriminated by
        `type`: a `user` (direct user→role assignment) or a `role` (role→role edge).
        Identity is hydrated; for requests and add confirmations use the
        un-hydrated [`RoleMemberRef`] instead.
      discriminator:
        propertyName: type
        mapping:
          role: '#/components/schemas/RoleMemberRole'
          user: '#/components/schemas/RoleMemberUser'
    RoleMemberRef:
      oneOf:
        - $ref: '#/components/schemas/RoleMemberRefUser'
        - $ref: '#/components/schemas/RoleMemberRefRole'
      description: |-
        An identity reference to a role member — a `user` or a `role`, by typed id.
        Sent in `POST /role/{id}/members` requests and echoed by the add confirmation
        (remove returns `204` with no body). Unlike [`RoleMember`] it is never hydrated
        (no display name): it names *which* principal, not its display identity.
      discriminator:
        propertyName: type
        mapping:
          role: '#/components/schemas/RoleMemberRefRole'
          user: '#/components/schemas/RoleMemberRefUser'
    RoleMemberRefRole:
      type: object
      description: A role, by id.
      required:
        - id
        - type
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          enum:
            - role
    RoleMemberRefUser:
      type: object
      description: A user, by `IdP` subject id.
      required:
        - id
        - type
      properties:
        id:
          type: string
        type:
          type: string
          enum:
            - user
    RoleMemberRole:
      allOf:
        - $ref: '#/components/schemas/RoleMembership'
          description: Another role that is a member of the role.
        - type: object
          required:
            - type
          properties:
            type:
              type: string
              enum:
                - role
      description: Another role that is a member of the role.
    RoleMemberType:
      type: string
      description: Kind of a role member. Serializes as `"user"` / `"role"`.
      enum:
        - user
        - role
    RoleMemberUser:
      allOf:
        - $ref: '#/components/schemas/UserMembership'
          description: A user assigned to the role.
        - type: object
          required:
            - type
          properties:
            type:
              type: string
              enum:
                - user
      description: A user assigned to the role.
    RoleMembership:
      type: object
      description: |-
        A role's display identity in a membership listing: the role-member variant of
        [`RoleMember`], and the item type of `/member-of` and `/user/{id}/roles`.
        `ident` (`provider/source-id`) is the stable external handle a client references
        the role by; `id` is the internal UUID. All fields are always present — a role
        whose id no longer resolves in the catalog (a dangling authorizer edge) is
        dropped from the listing and logged, never surfaced with a null identity.
      required:
        - id
        - ident
        - name
      properties:
        id:
          type: string
          format: uuid
        ident:
          type: string
        name:
          type: string
    RoleMetadata:
      type: object
      description: |-
        Metadata of a role with reduced information.
        Returned for cross-project role references.
      required:
        - id
        - ident
        - provider-id
        - source-id
        - name
        - project-id
      properties:
        id:
          type: string
          format: uuid
          description: Globally unique UUID identifier
        ident:
          type: string
          description: Composite project-scoped identifier (`provider~source_id`).
        name:
          type: string
          description: Name of the role
        project-id:
          type: string
          description: Project ID in which the role is created.
        provider-id:
          type: string
          description: Provider that owns this role (e.g. `"lakekeeper"`, `"oidc"`).
        source-id:
          type: string
          description: Identifier of the role in the provider.
    RoleRelation:
      type: string
      enum:
        - assignee
        - ownership
    S3AccessKeyCredential:
      type: object
      title: S3CredentialAccessKey
      required:
