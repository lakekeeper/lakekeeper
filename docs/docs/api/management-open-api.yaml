          type: string
          format: uuid
          description: ID of the warehouse.
          deprecated: true
        managed-by:
          $ref: '#/components/schemas/ManagedBy'
          description: |-
            Which control plane, if any, exclusively manages this warehouse's spec.
            When not `self-managed`, spec mutations are restricted to that control plane.
        name:
          type: string
          description: Name of the warehouse.
        project-id:
          type: string
          description: Project ID in which the warehouse was created.
        protected:
          type: boolean
          description: Whether the warehouse is protected from being deleted.
        status:
          $ref: '#/components/schemas/WarehouseStatus'
          description: Whether the warehouse is active.
        storage-credential-type:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/StorageCredentialType'
              description: |-
                Best-effort indicator of the storage credential type. When present it
                reflects the detected credential kind; when absent the warehouse may
                either have no credential configured or the secret lookup may have
                failed. Does not contain secret values.
