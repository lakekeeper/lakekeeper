        error:
          type:
            - string
            - 'null'
          description: Any validation error that occurred
        expiration:
          type:
            - string
            - 'null'
          format: date-time
          description: License expiration date (None for perpetual licenses like Apache)
        issuer:
          type:
            - string
            - 'null'
          description: Organization or entity that issued the license for Lakekeeper
        license-id:
          type:
            - string
            - 'null'
          description: License ID or identifier
        license-type:
          type: string
          description: License type (e.g., "Apache-2.0", "Vakamo-Enterprise", etc.)
        valid:
          type: boolean
          description: If the license is valid and active
    ListColumnTagsResponse:
      type: object
      description: |-
        Every column of a table that carries at least one tag, each with its direct tags;
        columns without tags are omitted. Column tags are never inherited, so this is a
        direct-only listing (no effective view).
      required:
        - columns
      properties:
        columns:
          type: array
          items:
            $ref: '#/components/schemas/ColumnTags'
    ListDeletedTabularsResponse:
      type: object
      required:
        - tabulars
      properties:
        next-page-token:
          type:
            - string
            - 'null'
          description: Token to fetch the next page
        tabulars:
          type: array
          items:
            $ref: '#/components/schemas/DeletedTabularResponse'
          description: List of tabulars
    ListGrantsResponse:
      type: object
      description: |-
        A page of grants.

        The order is **unspecified** and differs by authorizer, so do not rely on it. Use the
        page token to walk a listing, and sort client-side if you need a stable presentation.
      required:
        - grants
      properties:
        grants:
          type: array
          items:
            $ref: '#/components/schemas/GrantResponse'
        next-page-token:
          type:
            - string
            - 'null'
          description: |-
            Present when another page may follow. Follow the token until it is **absent**:
            depending on the authorizer, a page can come back short or even empty while
            more grants remain, so neither a short page nor an empty one signals the end.

            The project-scoped listing pages like the rest, but only where grants live in
            the catalog. An authorizer that owns its grants may not implement that listing
            at all — see its `501` response.
    ListProjectTasksRequest:
      type: object
      properties:
        created-after:
          type:
            - string
            - 'null'
          format: date-time
          description: Filter tasks created after this timestamp
          example: 2025-12-31T23:59:59Z
        created-before:
          type:
            - string
            - 'null'
          format: date-time
          description: Filter tasks created before this timestamp
          example: 2025-12-31T23:59:59Z
        page-size:
          type:
            - integer
            - 'null'
          format: int64
          description: Number of results per page
        page-token:
          type:
            - string
            - 'null'
          description: |-
