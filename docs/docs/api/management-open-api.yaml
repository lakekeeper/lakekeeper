        - account-id
      properties:
        access-key-id:
          type: string
          description: Access key ID used for IO operations of Lakekeeper
        account-id:
          type: string
          description: Cloudflare account ID, used to determine the temporary credentials endpoint.
        secret-access-key:
          type: string
          description: Secret key associated with the access key ID.
        token:
          type: string
          description: |-
            Token associated with the access key ID.
            This is used to fetch downscoped temporary credentials for vended credentials.
    S3Credential:
      oneOf:
        - $ref: '#/components/schemas/S3CredentialAccessKey'
        - $ref: '#/components/schemas/S3CredentialAwsSystemIdentity'
        - $ref: '#/components/schemas/S3CredentialCloudflareR2'
        - $ref: '#/components/schemas/S3CredentialAliyunOss'
      discriminator:
        propertyName: credential-type
        mapping:
          access-key: '#/components/schemas/S3CredentialAccessKey'
          aliyun-oss: '#/components/schemas/S3CredentialAliyunOss'
          aws-system-identity: '#/components/schemas/S3CredentialAwsSystemIdentity'
          cloudflare-r2: '#/components/schemas/S3CredentialCloudflareR2'
    S3CredentialAccessKey:
      allOf:
        - $ref: '#/components/schemas/S3AccessKeyCredential'
          description: Authenticate to AWS using access-key and secret-key.
        - type: object
          required:
            - credential-type
          properties:
            credential-type:
              type: string
              enum:
                - access-key
      description: Authenticate to AWS using access-key and secret-key.
    S3CredentialAliyunOss:
      allOf:
        - $ref: '#/components/schemas/S3AccessKeyCredential'
          description: |-
            **Beta:** Alibaba Cloud OSS support is in beta. The API and behavior may change in a
            future release.

            Authenticate to Alibaba Cloud OSS using access-key and secret-key.
            Temporary credentials are vended via the Alibaba Cloud STS `AssumeRole` API.
        - type: object
          required:
            - credential-type
          properties:
            credential-type:
              type: string
              enum:
                - aliyun-oss
      description: |-
        **Beta:** Alibaba Cloud OSS support is in beta. The API and behavior may change in a
        future release.

        Authenticate to Alibaba Cloud OSS using access-key and secret-key.
        Temporary credentials are vended via the Alibaba Cloud STS `AssumeRole` API.
    S3CredentialAwsSystemIdentity:
      allOf:
        - $ref: '#/components/schemas/S3AwsSystemIdentityCredential'
          description: |-
            Authenticate to AWS using the identity configured on the system
             that runs lakekeeper. The AWS SDK is used to load the credentials.
        - type: object
          required:
            - credential-type
          properties:
            credential-type:
              type: string
              enum:
                - aws-system-identity
      description: |-
        Authenticate to AWS using the identity configured on the system
         that runs lakekeeper. The AWS SDK is used to load the credentials.
    S3CredentialCloudflareR2:
      allOf:
        - $ref: '#/components/schemas/S3CloudflareR2Credential'
        - type: object
          required:
