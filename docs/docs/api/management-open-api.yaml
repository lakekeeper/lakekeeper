          description: Subpath in the bucket to use.
        storage-layout:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/StorageLayout'
              description: Storage layout for namespace and tabular paths.
        sts-enabled:
          type: boolean
          description: |-
            Enable STS (Security Token Service) downscoped token generation for GCS.
            When disabled, clients cannot use vended credentials for this storage profile.
            Defaults to true.
