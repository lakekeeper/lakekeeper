            Timestamp of when these statistics are valid until

            We lazily create a new statistics entry every hour, in between hours, the existing entry
            is being updated. If there's a change at `created_at` + 1 hour, a new entry is created. If
            there's no change, no new entry is created.
        updated-at:
          type: string
          format: date-time
          description: Timestamp of when these statistics were last updated
    WarehouseStatisticsResponse:
      type: object
      required:
        - warehouse-ident
        - stats
      properties:
        next-page-token:
          type:
            - string
            - 'null'
          description: Next page token
        stats:
          type: array
          items:
            $ref: '#/components/schemas/WarehouseStatistics'
          description: Ordered list of warehouse statistics.
        warehouse-ident:
          type: string
          format: uuid
          description: ID of the warehouse for which the stats were collected.
    WarehouseStatus:
      type: string
      description: Status of a warehouse
      enum:
        - active
        - inactive
    WarehouseTaskEntityFilter:
      oneOf:
        - $ref: '#/components/schemas/WarehouseTaskEntityFilterTable'
        - $ref: '#/components/schemas/WarehouseTaskEntityFilterView'
        - $ref: '#/components/schemas/WarehouseTaskEntityFilterGenericTable'
        - $ref: '#/components/schemas/WarehouseTaskEntityFilterWarehouse'
      discriminator:
        propertyName: type
        mapping:
          generic-table: '#/components/schemas/WarehouseTaskEntityFilterGenericTable'
          table: '#/components/schemas/WarehouseTaskEntityFilterTable'
          view: '#/components/schemas/WarehouseTaskEntityFilterView'
          warehouse: '#/components/schemas/WarehouseTaskEntityFilterWarehouse'
    WarehouseTaskEntityFilterGenericTable:
      type: object
      description: Get tasks for a specific generic table
      required:
        - generic-table-id
        - type
      properties:
        generic-table-id:
          type: string
          format: uuid
        type:
          type: string
          enum:
            - generic-table
    WarehouseTaskEntityFilterTable:
      type: object
      description: Get tasks for a specific table
      required:
        - table-id
        - type
      properties:
        table-id:
          type: string
          format: uuid
        type:
          type: string
          enum:
            - table
    WarehouseTaskEntityFilterView:
      type: object
      description: Get tasks for a specific view
      required:
        - view-id
        - type
      properties:
        type:
          type: string
          enum:
            - view
        view-id:
          type: string
          format: uuid
    WarehouseTaskEntityFilterWarehouse:
      type: object
      description: |-
        Get Warehouse-level tasks which are not associated with a specific entity
        inside the warehouse
      required:
        - type
      properties:
        type:
          type: string
          enum:
            - warehouse
    WarehouseTaskEntityId:
      oneOf:
        - $ref: '#/components/schemas/WarehouseTaskEntityIdTable'
        - $ref: '#/components/schemas/WarehouseTaskEntityIdView'
        - $ref: '#/components/schemas/WarehouseTaskEntityIdGenericTable'
      discriminator:
        propertyName: type
        mapping:
          generic-table: '#/components/schemas/WarehouseTaskEntityIdGenericTable'
          table: '#/components/schemas/WarehouseTaskEntityIdTable'
          view: '#/components/schemas/WarehouseTaskEntityIdView'
    WarehouseTaskEntityIdGenericTable:
      type: object
      required:
        - generic-table-id
        - type
      properties:
        generic-table-id:
          type: string
          format: uuid
        type:
          type: string
          enum:
            - generic-table
    WarehouseTaskEntityIdTable:
      type: object
      required:
        - table-id
        - type
      properties:
        table-id:
          type: string
          format: uuid
        type:
          type: string
          enum:
            - table
    WarehouseTaskEntityIdView:
      type: object
      required:
        - view-id
        - type
      properties:
        type:
          type: string
          enum:
            - view
        view-id:
          type: string
          format: uuid
    WarehouseTaskInfo:
      type: object
      required:
        - task-id
        - project-id
        - warehouse-id
        - queue-name
        - status
        - scheduled-for
        - attempt
        - progress
        - created-at
      properties:
        attempt:
          type: integer
          format: int32
          description: Current attempt number
        created-at:
          type: string
          format: date-time
          description: When this task attempt was created
        entity:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/WarehouseTaskEntityId'
              description: Type of the sub-entity this task operates on. None if this is a warehouse-level task.
        entity-name:
          type:
            - array
            - 'null'
          items:
            type: string
          description: Name of the entity this task operates on. None if this is a warehouse-level task.
        last-heartbeat-at:
          type:
            - string
            - 'null'
          format: date-time
          description: Last heartbeat timestamp for running tasks
        parent-task-id:
          type:
            - string
            - 'null'
          format: uuid
          description: Parent task ID if this is a sub-task
        picked-up-at:
          type:
            - string
            - 'null'
          format: date-time
          description: When the latest attempt of the task was picked up for processing by a worker.
        progress:
          type: number
          format: float
          description: Progress of the task (0.0 to 1.0)
        project-id:
          type: string
          description: Project ID associated with the task
        queue-name:
          type: string
          description: Name of the queue processing this task
        scheduled-for:
          type: string
          format: date-time
          description: When the latest attempt of the task is scheduled for
        status:
          $ref: '#/components/schemas/TaskStatus'
          description: Current status of the task
        task-id:
          type: string
          format: uuid
          description: Unique identifier for the task
        updated-at:
          type:
            - string
            - 'null'
          format: date-time
          description: When the task was last updated
        warehouse-id:
          type: string
          format: uuid
          description: Warehouse ID associated with the task
    WhoamiResponse:
      allOf:
        - $ref: '#/components/schemas/User'
        - type: object
          required:
            - is-instance-admin
          properties:
            is-instance-admin:
              type: boolean
              description: |-
                Whether the authenticated principal is an instance admin (configured via
                `LAKEKEEPER__INSTANCE_ADMINS`). Instance admins may modify the spec of
                warehouses marked `managed-by: instance-admin`. Only ever `true` for a
                principal acting directly; role-assumed requests do not inherit it.
      description: |-
        Response of the `whoami` endpoint: the catalog user for the current token,
        plus request-scoped privilege not stored on the user record.
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
security:
  - bearerAuth: []
tags:
  - name: server
    description: Manage Server
  - name: project
    description: Manage Projects
  - name: warehouse
    description: Manage Warehouses
  - name: tasks
    description: View & Manage Tasks
  - name: user
    description: Manage Users
  - name: role
    description: Manage Roles
  - name: tag
    description: '**[Preview]** Manage governance tags. This API is in preview and may change in a backward-incompatible way in a future release.'
  - name: grant
    description: '**[Preview]** Manage grants: which principal holds which privilege on which resource. This API is in preview and may change in a backward-incompatible way in a future release.'
  - name: permissions-openfga
    description: Authorization and permissions management using OpenFGA
