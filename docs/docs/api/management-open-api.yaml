      properties:
        description:
          type:
            - string
            - 'null'
          description: Description of the role
        name:
          type: string
          description: Name of the role to create
        project-id:
          type:
            - string
            - 'null'
          description: |-
            Project ID in which the role is created.
            Deprecated: Please use the `x-project-id` header instead.
        provider-id:
          type:
            - string
            - 'null'
          description: |-
            Provider that owns this role (e.g. `"lakekeeper"`, `"oidc"`).
            Must be provided together with `source-id`. Omit both to let the server
            assign `provider-id = "lakekeeper"` and a fresh UUIDv7 `source-id`.
        source-id:
          type:
            - string
            - 'null'
          description: |-
            Identifier of the role in the provider.
            Must be provided together with `provider-id`.
    CreateTagDefinitionRequest:
      type: object
      required:
        - name
        - scope
        - value-kind
      properties:
        allowed-values:
          type:
            - array
            - 'null'
          items:
            type: string
          description: |-
            Permitted values. Required (non-empty) for `enumerated` definitions,
            must be omitted otherwise.
        description:
          type:
            - string
            - 'null'
          description: Description of the tag definition
        name:
          type: string
          description: |-
            Name of the tag definition. `.` is the hierarchy delimiter
            (e.g. `pii.classification`). Unique within the project,
            case-insensitively.
        scope:
          type: array
          items:
            $ref: '#/components/schemas/TagScope'
          description: Target types this definition may be applied to
        value-kind:
          $ref: '#/components/schemas/TagValueKind'
          description: How values of this definition are constrained
    CreateUserRequest:
      type: object
      properties:
        email:
          type:
            - string
            - 'null'
          description: |-
            Email of the user. If id is not specified, the email is extracted
            from the provided token.
        id:
          type:
            - string
            - 'null'
          description: |-
            Subject id of the user - allows user provisioning.
            The id must be identical to the subject in JWT tokens, prefixed
            with `<idp-identifier>~`. For example: `oidc~1234567890` for OIDC users
            or `kubernetes~1234567890` for Kubernetes users.
            To create users in self-service manner, do not set the id.
            The id is then extracted from the passed JWT token.
        name:
          type:
            - string
            - 'null'
          description: |-
            Name of the user. If id is not specified, the name is extracted
            from the provided token.
        update-if-exists:
          type: boolean
          description: |-
            Update the user if it already exists
            Default: false
        user-type:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/UserType'
              description: Type of the user. Useful to override wrongly classified users
    CreateWarehouseRequest:
      type: object
      required:
        - warehouse-name
        - storage-profile
      properties:
        allowed-format-versions:
          type:
            - array
            - 'null'
          items:
            type: integer
            format: int32
          description: |-
            Iceberg table format versions that may be created in, or upgraded to,
            within this warehouse. Must be a non-empty subset of `[1, 2, 3]`.
            Defaults to all supported versions when omitted.
        default-format-version:
          type:
            - integer
            - 'null'
          format: int32
          description: |-
            Default Iceberg table format version applied when a create-table request
            does not specify one. Must be a member of `allowed-format-versions`. When
            omitted, resolves to v2 if allowed, otherwise the highest allowed version.
        delete-profile:
          $ref: '#/components/schemas/TabularDeleteProfile'
          description: 'Profile to determine behavior upon dropping of tabulars. Default: hard deletion.'
        managed-by:
          $ref: '#/components/schemas/ManagedBy'
          description: |-
            Which control plane, if any, exclusively manages this warehouse's spec.
            Defaults to `self-managed`. Creating a managed warehouse (e.g. `instance-admin`)
            requires instance-admin privilege.
        project-id:
          type:
            - string
            - 'null'
          description: |-
            Project ID in which to create the warehouse.
            Deprecated: Please use the `x-project-id` header instead.
        storage-credential:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/StorageCredential'
              description: Optional storage credential to use for the warehouse.
        storage-profile:
          $ref: '#/components/schemas/StorageProfile'
          description: Storage profile to use for the warehouse.
        warehouse-name:
          type: string
          description: |-
            Name of the warehouse to create. Must be unique
            within a project and may not contain "/"
    CreateWarehouseResponse:
      $ref: '#/components/schemas/GetWarehouseResponse'
    DeletedTabularResponse:
      type: object
      required:
        - id
        - name
        - namespace
        - typ
        - warehouse-id
        - created-at
        - deleted-at
        - expiration-date
      properties:
        created-at:
          type: string
          format: date-time
          description: Date when the tabular was created
        deleted-at:
          type: string
          format: date-time
          description: Date when the tabular was deleted
        expiration-date:
          type: string
          format: date-time
          description: Date when the tabular will not be recoverable anymore
        id:
          type: string
          format: uuid
          description: Unique identifier of the tabular
        name:
          type: string
          description: Name of the tabular
        namespace:
          type: array
          items:
            type: string
          description: List of namespace parts the tabular belongs to
        typ:
          $ref: '#/components/schemas/TabularType'
          description: Type of the tabular
        warehouse-id:
          type: string
          format: uuid
          description: Warehouse ID where the tabular is stored
    EndpointMode:
      oneOf:
        - $ref: '#/components/schemas/EndpointModeDefault'
        - $ref: '#/components/schemas/EndpointModeRegional'
        - $ref: '#/components/schemas/EndpointModeWorkspacePrivateLink'
      description: |-
        How Lakekeeper connects to the `OneLake` DFS endpoint.

        Fabric supports two kinds of Azure Private Link configurations, and only
        one of them maps to a dedicated variant here:

        - **Tenant-level private link**: traffic to the global host
          `onelake.dfs.fabric.microsoft.com` is routed privately via DNS that
          points the global FQDN at a tenant-PE NIC. From Lakekeeper's
          perspective this is indistinguishable from public traffic — use
          `Default`. (Same shape as a private endpoint in front of a regular
          ADLS Gen2 storage account.)
        - **Workspace-level private link**: each workspace gets its own
          `<wsId>.z<xy>.dfs.fabric.microsoft.com` FQDN routed via a
          workspace-scoped PE. Lakekeeper needs to build that FQDN — use
          [`WorkspacePrivateLink`].
      discriminator:
        propertyName: type
        mapping:
          default: '#/components/schemas/EndpointModeDefault'
          regional: '#/components/schemas/EndpointModeRegional'
          workspace-private-link: '#/components/schemas/EndpointModeWorkspacePrivateLink'
    EndpointModeDefault:
      type: object
      description: |-
        Use the global `OneLake` endpoint `onelake.dfs.fabric.microsoft.com`. Default.

        Also the correct choice for tenant-level private link — tenant PE
        only changes DNS resolution, not the URL Lakekeeper constructs.
      required:
        - type
      properties:
        type:
          type: string
          enum:
            - default
    EndpointModeRegional:
      type: object
      description: |-
        Use a region-pinned endpoint `<region>-onelake.dfs.fabric.microsoft.com`.
        Use this when data residency requires the request to stay within a
        specific Azure region.
      required:
        - region
        - type
      properties:
        region:
          type: string
          description: |-
            Azure region slug, e.g. `westus`, `centralus`, `northeurope`.
            Trimmed and lowercased at validation time, then pattern-checked to
            match the Azure region-slug shape (lowercase ASCII letter followed
            by lowercase letters or digits) so a stray `.` or `-` can't smuggle
            an extra host segment into the resolved DFS host. An unknown but
            well-shaped slug still surfaces as a DNS-resolution failure at
            access time. See `normalize_endpoint_mode` for the exact rule.
        type:
          type: string
          enum:
            - regional
    EndpointModeWorkspacePrivateLink:
      type: object
      description: |-
        Use a workspace-scoped private-link endpoint
        `<workspaceId>.z<xy>.dfs.fabric.microsoft.com`. The host is computed
        from the workspace ID at runtime; users only opt in via this variant.

        For *tenant*-level private link, stay on [`Default`] — the global
        onelake FQDN is what gets routed through a tenant PE.
      required:
        - type
      properties:
        type:
          type: string
          enum:
            - workspace-private-link
    EndpointStatistic:
      type: object
      required:
        - count
        - http-route
        - status-code
        - created-at
      properties:
        count:
          type: integer
          format: int64
          description: Number of requests to this endpoint for the current time-slice.
        created-at:
          type: string
          format: date-time
          description: |-
            Timestamp at which the datapoint was created in the database.

            This is the exact time at which the current endpoint-status-warehouse combination was called
            for the first time in the current time-slice.
        http-route:
          type: string
          description: |-
            The route of the endpoint.

            Format: `METHOD /path/to/endpoint`
        status-code:
          type: integer
          format: int32
          description: The status code of the response.
          minimum: 0
        updated-at:
          type:
            - string
            - 'null'
          format: date-time
          description: |-
            Timestamp at which the datapoint was last updated.

            This is the exact time at which the current datapoint was last updated.
        warehouse-id:
          type:
            - string
            - 'null'
          format: uuid
          description: |-
            The ID of the warehouse that handled the request.

            Only present for requests that could be associated with a warehouse. Some management
            endpoints cannot be associated with a warehouse, e.g. warehouse creation or user management
            will not have a `warehouse-id`.
        warehouse-name:
          type:
            - string
            - 'null'
          description: |-
            The name of the warehouse that handled the request.

            Only present for requests that could be associated with a warehouse. Some management
            endpoints cannot be associated with a warehouse, e.g. warehouse creation or user management
            will not have a `warehouse-id`
    EndpointStatisticsResponse:
      type: object
      required:
        - timestamps
        - called-endpoints
        - previous-page-token
        - next-page-token
      properties:
        called-endpoints:
          type: array
          items:
            type: array
            items:
              $ref: '#/components/schemas/EndpointStatistic'
          description: |-
            Array of arrays of statistics detailing each called endpoint for each `timestamp`.

            See docs of `timestamps` for more details.
        next-page-token:
          type: string
          description: |-
            Token to get the next page of results.

            Inverse of `previous-page-token`, see its documentation above.
        previous-page-token:
          type: string
          description: |-
            Token to get the previous page of results.

            Endpoint statistics are not paginated through page-limits, we paginate them by stepping
            through time. By default, the list-statistics endpoint will return all statistics for
            `now()` - 1 day to `now()`. In the request, you can specify a `range_specifier` to set the end
            date and step interval. The `previous-page-token` will then move to the neighboring window.
            E.g. in the default case of `now()` and 1 day, it'd be `now()` - 2 days to `now()` - 1 day.
        timestamps:
          type: array
          items:
            type: string
            format: date-time
          description: |-
            Array of timestamps indicating the time at which each entry in the `called_endpoints` array
            is valid.

            We lazily create a new statistics entry every hour, in between hours, the existing entry
            is being updated. If any endpoint is called in the following hour, there'll be an entry in
            `timestamps` for the following hour. If not, then there'll be no entry.
    ErrorModel:
      type: object
      description: JSON error payload returned in a response with further details on the error
      required:
        - message
        - type
        - code
      properties:
        code:
          type: integer
          format: int32
          description: HTTP response code
          minimum: 0
        message:
          type: string
          description: Human-readable error message
        stack:
          type: array
          items:
            type: string
        type:
          type: string
          description: Internal type definition of the error
    GcsCredential:
      oneOf:
        - $ref: '#/components/schemas/GcsCredentialServiceAccountKey'
        - $ref: '#/components/schemas/GcsCredentialSystemIdentity'
      description: |-
        GCS Credentials

        Currently only supports Service Account Key
        Example of a key:
        ```json
            {
              "type": "service_account",
              "project_id": "example-project-1234",
              "private_key_id": "....",
              "private_key": "-----BEGIN PRIVATE KEY-----\n.....\n-----END PRIVATE KEY-----\n",
              "client_email": "abc@example-project-1234.iam.gserviceaccount.com",
              "client_id": "123456789012345678901",
              "auth_uri": "https://accounts.google.com/o/oauth2/auth",
              "token_uri": "https://oauth2.googleapis.com/token",
              "auth_provider_x509_cert_url": "https://www.googleapis.com/oauth2/v1/certs",
              "client_x509_cert_url": "https://www.googleapis.com/robot/v1/metadata/x509/abc%example-project-1234.iam.gserviceaccount.com",
              "universe_domain": "googleapis.com"
            }
        ```
      discriminator:
        propertyName: credential-type
        mapping:
          gcp-system-identity: '#/components/schemas/GcsCredentialSystemIdentity'
          service-account-key: '#/components/schemas/GcsCredentialServiceAccountKey'
    GcsCredentialServiceAccountKey:
      type: object
      description: |-
        Service Account Key

        The key is the JSON object obtained when creating a service account key in the GCP console.
      required:
        - key
        - credential-type
      properties:
        credential-type:
          type: string
          enum:
            - service-account-key
        key:
          $ref: '#/components/schemas/GcsServiceKey'
    GcsCredentialSystemIdentity:
      type: object
      description: |-
        GCP System Identity

        Use the service account that the application is running as.
        This can be a Compute Engine default service account or a user-assigned service account.
      required:
        - credential-type
      properties:
        credential-type:
          type: string
          enum:
            - gcp-system-identity
    GcsCredentialType:
      type: string
      description: The type of GCS credential.
      enum:
        - service-account-key
        - gcp-system-identity
    GcsProfile:
      type: object
      required:
