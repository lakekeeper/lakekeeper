openapi: 3.1.0
info:
  title: Lakekeeper Management API
  description: Lakekeeper is a rust-native Apache Iceberg REST Catalog implementation. The Management API provides endpoints to manage the server, projects, warehouses, users, and roles. If Authorization is enabled, permissions can also be managed. An interactive Swagger-UI for the specific Lakekeeper Version and configuration running is available at `/swagger-ui/#/` of Lakekeeper (by default [http://localhost:8181/swagger-ui/#/](http://localhost:8181/swagger-ui/#/)).
  license:
    name: Apache-2.0
    identifier: Apache-2.0
  version: 0.0.0
servers:
  - url: '{scheme}://{host}{basePath}'
    description: Lakekeeper Management API
    variables:
      basePath:
        default: ''
        description: Optional path prefix (starting with '/') to be prepended to all routes
      host:
        default: localhost
        description: The host (and optional port) for the specified server
      scheme:
        default: https
        description: The scheme of the URI, either http or https
paths:
  /management/v1/action/batch-check:
    post:
      tags:
        - authorization
      summary: Batch Check Catalog Actions
      description: |-
        Performs authorization checks for multiple catalog actions in a single request.
        This endpoint allows checking permissions across different resource types (servers, projects,
        warehouses, namespaces, tables, and views) efficiently.

        The endpoint supports:
        - Checking actions for different identities (users or roles)
        - Mixing different resource types in a single batch
        - Optional error-on-not-found behavior (default: treat missing resources as denied)

        Each check in the request can optionally override the identity being checked.
        If no identity is specified, the current user's identity is used.
      operationId: batch_check_actions
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CatalogActionsBatchCheckRequest'
        required: true
      responses:
        '200':
          description: Batch check results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogActionsBatchCheckResponse'
        4XX:
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IcebergErrorResponse'
  /management/v1/bootstrap:
    post:
      tags:
        - server
      summary: Bootstrap
      description: |-
        Initializes the Lakekeeper server and sets the initial administrator account.
        This operation can only be performed once.
      operationId: bootstrap
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BootstrapRequest'
        required: true
      responses:
        '204':
          description: Server bootstrapped successfully
        4XX:
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IcebergErrorResponse'
        '500':
          description: InternalError
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IcebergErrorResponse'
  /management/v1/endpoint-statistics:
    post:
      tags:
        - project
      summary: Get API Statistics
      description: |-
        Retrieves detailed endpoint call statistics for your project, allowing you to monitor API usage patterns,
        track frequency of operations, and analyze response codes.

        ## Data Collection

        The statistics include:
        - Endpoint paths and HTTP methods
        - Response status codes
        - Call counts per endpoint
        - Warehouse context (when applicable)
        - Timestamps of activity

        ## Time Aggregation

        Statistics are aggregated hourly. Within each hour window:
        - An initial entry is created on the first API call
        - Subsequent calls update the existing hourly entry
        - Each hour boundary creates a new aggregation bucket
        - Hours with no API activity have no entries (gaps in data)

        ## Response Format

        The response includes timestamp buckets (in UTC) and corresponding endpoint metrics,
        allowing for time-series analysis of API usage patterns.

        Example:
        - 00:00:00-00:16:32: no activity
            - `timestamps: []`
        - 00:16:32: warehouse created:
            - `{timestamps: ["01:00:00"], called_endpoints: [[{"count": 1, "http_route": "POST /management/v1/warehouse", "status_code": 201, "warehouse_id": null, "warehouse_name": null, "created_at": "00:16:32", "updated_at": null}]]}`
        - 00:30:00: table created:
            - `timestamps: ["01:00:00"], called_endpoints: [[{"count": 1, "http_route": "POST /management/v1/warehouse", "status_code": 201, "warehouse_id": null, "warehouse_name": null, "created_at": "00:16:32", "updated_at": null}, {"count": 1, "http_route": "POST /catalog/v1/{prefix}/namespaces/{namespace}/tables", "status_code": 201, "warehouse_id": "ff17f1d0-90ad-4e7d-bf02-be718b78c2ee", "warehouse_name": "staging", "created_at": "00:30:00", "updated_at": null}]]`
        - 00:45:00: table created:
            - `timestamps: ["01:00:00"], called_endpoints: [[{"count": 1, "http_route": "POST /management/v1/warehouse", "status_code": 201, "warehouse_id": null, "warehouse_name": null, "created_at": "00:16:32", "updated_at": null}, {"count": 1, "http_route": "POST /catalog/v1/{prefix}/namespaces/{namespace}/tables", "status_code": 201, "warehouse_id": "ff17f1d0-90ad-4e7d-bf02-be718b78c2ee", "warehouse_name": "staging", "created_at": "00:30:00", "updated_at": "00:45:00"}]]`
        - 01:00:36: table deleted:
            - `timestamps: ["01:00:00","02:00:00"], called_endpoints: [[{"count": 1, "http_route": "POST /management/v1/warehouse", "status_code": 201, "warehouse_id": null, "warehouse_name": null, "created_at": "00:16:32", "updated_at": null},{"count": 1, "http_route": "POST /catalog/v1/{prefix}/namespaces/{namespace}/tables", "status_code": 201, "warehouse_id": "ff17f1d0-90ad-4e7d-bf02-be718b78c2ee", "warehouse_name": "staging", "created_at": "00:30:00", "updated_at": "00:45:00"}],[{"count": 1, "http_route": "DELETE /catalog/v1/{prefix}/namespaces/{namespace}/tables/{table}", "status_code": 200, "warehouse_id": "ff17f1d0-90ad-4e7d-bf02-be718b78c2ee", "warehouse_name": "staging", "created_at": "01:00:36", "updated_at": "null"}]]`
      operationId: get_endpoint_statistics
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GetEndpointStatisticsRequest'
        required: true
      responses:
        '200':
          description: Endpoint statistics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EndpointStatisticsResponse'
        4XX:
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IcebergErrorResponse'
  /management/v1/grants:
    get:
      tags:
        - grant
      summary: List Grants [Preview]
      description: |-
        This API may change in a backward-incompatible way in a future release.

        Lists everything one principal holds across the project — "what does this
        principal have here". Exactly one of `principalUser` or `principalRole` is
        **required**; a request naming neither is refused with `MissingGrantPrincipal`
        (400). To read every grant held on a single resource, use that resource's own
        listing.

        Grants are reported at the layer they are held: a grant a role holds is listed
        under that role, not under the users who have the role, and a grant on an
        ancestor is listed under the ancestor. Server grants belong to no project and are
        not included.

        Listing your own grants needs no extra permission; any other principal requires
        the project-level grant-read permission.

        **Availability depends on the configured authorizer.** This listing crosses every
        resource in the project, which an authorizer that stores permissions per resource
        cannot answer without reading its whole store. Those report
        `GrantListingNotImplemented` (501) — under OpenFGA, for example. Read one
        resource's grants from its own endpoint instead; those listings work, and page,
        under every authorizer. `GET /info` reports the configured backend.
      operationId: list_grants
      parameters:
        - name: principalUser
          in: query
          description: |-
            List only the grants held by this user. Mutually exclusive with `principalRole`.
            A resource's own listing accepts neither and then lists every principal's; the
            project-wide listing requires one of the two.
          required: false
          schema:
            type:
              - string
              - 'null'
        - name: principalRole
          in: query
          description: |-
            List only the grants held by this role. Mutually exclusive with `principalUser`,
            and subject to the same requirement on the project-wide listing.
          required: false
          schema:
            type:
              - string
              - 'null'
            format: uuid
        - name: pageToken
          in: query
          description: Next page token
          required: false
          schema:
            type: string
        - name: pageSize
          in: query
          description: Signals an upper bound of the number of results that a client will receive.
          required: false
          schema:
            type:
              - integer
              - 'null'
            format: int64
        - name: x-project-id
          in: header
          description: Project ID (optional; falls back to the default project if not provided)
          required: false
          schema:
            type:
              - string
              - 'null'
      responses:
        '200':
          description: Grants the principal holds in the project
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListGrantsResponse'
        4XX:
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IcebergErrorResponse'
        '501':
          description: Project-wide grant listing is not supported under the configured authorizer backend
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IcebergErrorResponse'
  /management/v1/grants/grantable-privileges:
    get:
      tags:
        - grant
      summary: Get Available Privileges [Preview]
      description: |-
        This API may change in a backward-incompatible way in a future release.

        Lists the privileges that may be granted, per resource type. The vocabulary
        belongs to the configured authorizer, so it differs between deployments and a
        name this server does not know is rejected — fetch it rather than hard-coding it.
