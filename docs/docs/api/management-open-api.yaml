components:
  schemas:
    AddRoleMembersRequest:
      type: object
      description: |-
        Request body for `POST /role/{id}/members`. Batch: adds every listed member to
        the role atomically (all-or-nothing).
      required:
        - members
      properties:
        members:
          type: array
          items:
            $ref: '#/components/schemas/RoleMemberRef'
    AddRoleMembersResponse:
      type: object
      description: |-
        Response for `POST /role/{id}/members`: the requested members confirmed present
        (idempotent — already-present members are included). Echoes identity
        [`RoleMemberRef`]s, not hydrated [`RoleMember`]s — use `GET /role/{id}/members`
        for display names.
      required:
        - members
      properties:
        members:
          type: array
          items:
            $ref: '#/components/schemas/RoleMemberRef'
    AdlsProfile:
      type: object
      description: |-
        Storage profile for a generic Azure Data Lake Storage Gen2 account.

        This profile speaks ADLS Gen2 against any storage account (including
        Microsoft Fabric / `OneLake`, if you configure `account_name = "onelake"`,
        `host = "dfs.fabric.microsoft.com"`, and a `key_prefix` like
        `<lakehouse>/Files/<sub>`). Lakekeeper offers `OneLakeProfile` as a
        convenience layer that knows how to compute those values from
        workspace + lakehouse IDs and that supports `OneLake`'s private-link endpoint
        pattern.
      required:
        - filesystem
        - account-name
      properties:
        account-name:
          type: string
          description: Name of the azure storage account.
        allow-alternative-protocols:
          type: boolean
          description: |-
            Allow alternative protocols such as `wasbs://` in locations.
            This is disabled by default. We do not recommend to use this setting
            except for migration of old tables via the register endpoint.
        authority-host:
          type:
            - string
            - 'null'
          format: uri
          description: 'The authority host to use for authentication. Default: `https://login.microsoftonline.com`.'
        filesystem:
          type: string
          description: Name of the adls filesystem, in blobstorage also known as container.
        host:
          type:
            - string
            - 'null'
          description: 'The host to use for the storage account. Default: `dfs.core.windows.net`.'
        key-prefix:
          type:
            - string
            - 'null'
          description: Subpath in the filesystem to use.
        sas-enabled:
          type: boolean
          description: |-
            Enable SAS (Shared Access Signature) token generation for Azure Data Lake Storage.
            When disabled, clients cannot use vended credentials for this storage profile.
            Defaults to true.
        sas-token-validity-seconds:
          type:
            - integer
            - 'null'
          format: int64
          description: 'The validity of the sas token in seconds. Default: 3600. Max: 7 days.'
          minimum: 0
        storage-layout:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/StorageLayout'
              description: Storage layout for namespace and tabular paths.
    AppliedTag:
      type: object
      required:
        - tag-definition-id
        - name
        - applied-at
      properties:
        applied-at:
          type: string
          format: date-time
          description: Timestamp when the tag was applied or last updated on this target
        name:
          type: string
          description: Name of the applied tag definition
        tag-definition-id:
          type: string
          format: uuid
          description: ID of the applied tag definition
        value:
          type:
            - string
            - 'null'
          description: Value the tag carries on this target
    ApplyGrantsRequest:
      type: object
      description: |-
        A grant diff: create `writes`, remove `deletes`.

        Applied atomically, and safe to retry: applying the same diff twice has the same
        effect as applying it once. The same entry may not appear in both lists — that is
        rejected rather than resolved, because either reading of it would be a guess.

        Unknown fields are rejected: a misspelled `deletes` would otherwise silently apply
        the writes and drop the revocations.

        At least one entry is required, and `writes` and `deletes` together may not exceed
        100. Neither rule is expressible as a per-field schema constraint — a `maxItems` on
        each array would say 200 are acceptable — so both are stated here and enforced by
        the server.
      properties:
        deletes:
          type: array
          items:
            $ref: '#/components/schemas/GrantEntry'
          description: Grants to remove. Counts against the shared 100-entry limit with `writes`.
          maxItems: 100
        writes:
          type: array
          items:
            $ref: '#/components/schemas/GrantEntry'
          description: Grants to create. Counts against the shared 100-entry limit with `deletes`.
          maxItems: 100
      additionalProperties: false
    AzCredential:
      oneOf:
        - $ref: '#/components/schemas/AzCredentialClientCredentials'
        - $ref: '#/components/schemas/AzCredentialSharedAccessKey'
        - $ref: '#/components/schemas/AzCredentialManagedIdentity'
      discriminator:
