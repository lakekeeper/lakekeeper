              description: |-
                For an effective tag inherited from an ancestor, the object it is attached
                to. Absent when the tag is attached directly to the queried object. Only
                ever populated with `effective=true`.
        name:
          type: string
          description: Name of the tag definition
        source:
          $ref: '#/components/schemas/TagSource'
          description: |-
            How the supplying attachment was produced (producer axis, e.g. `manual`;
            independent of direct-vs-inherited, which is `inherited-from`)
        tag-definition-id:
          type: string
          format: uuid
          description: ID of the tag definition
        updated-at:
          type:
            - string
            - 'null'
          format: date-time
          description: Timestamp when the supplying attachment's value was last updated
        value:
          type:
            - string
            - 'null'
          description: Value the tag carries on the supplying attachment
    TaskAttempt:
      type: object
      required:
        - attempt
        - status
        - scheduled-for
        - created-at
        - progress
      properties:
        attempt:
          type: integer
          format: int32
          description: Attempt number
        created-at:
          type: string
          format: date-time
          description: When this attempt was created
        duration:
          type:
            - string
            - 'null'
          description: How long this attempt took
          example: PT1H30M45.5S
        execution-details:
          type:
            - object
            - 'null'
          description: Execution details for this attempt
        message:
          type:
            - string
            - 'null'
          description: Message associated with this attempt
        progress:
          type: number
          format: float
          description: Progress achieved in this attempt
        scheduled-for:
          type: string
          format: date-time
          description: When this attempt was scheduled for
        started-at:
          type:
            - string
            - 'null'
          format: date-time
          description: When this attempt started
        status:
          $ref: '#/components/schemas/TaskStatus'
          description: Status of this attempt
    TaskLogCleanupConfig:
      type: object
      properties:
        cleanup-period:
          type:
            - string
            - 'null'
          description: |-
            How often to run the cleanup task in ISO8601 duration format. Defaults to once a day (P1D).
            If a value below 1 day is provided, it will be set to the default of 1 day.
          example: PT1H30M45.5S
        retention-period:
          type:
            - string
            - 'null'
          description: How long to retain task logs before deletion in ISO8601 duration format. Defaults to 90 days.
          example: PT1H30M45.5S
    TaskStatus:
      type: string
      enum:
        - RUNNING
        - SCHEDULED
        - STOPPING
        - CANCELLED
        - SUCCESS
        - FAILED
    TimeWindowSelector:
      oneOf:
        - $ref: '#/components/schemas/TimeWindowSelectorWindow'
        - $ref: '#/components/schemas/TimeWindowSelectorPageToken'
      discriminator:
        propertyName: type
        mapping:
          page-token: '#/components/schemas/TimeWindowSelectorPageToken'
          window: '#/components/schemas/TimeWindowSelectorWindow'
    TimeWindowSelectorPageToken:
      type: object
      required:
        - token
        - type
      properties:
        token:
          type: string
          description: |-
            Opaque Token from previous response for paginating through time windows

            Use the `next_page_token` or `previous_page_token` from a previous response
        type:
          type: string
          enum:
            - page-token
      example:
        type: page-token
        token: xyz
    TimeWindowSelectorWindow:
      type: object
      required:
        - end
        - interval
        - type
      properties:
        end:
          type: string
          format: date-time
          description: |-
            End timestamp of the time window
            Specify
          example: 2023-12-31T23:59:59Z
        interval:
          type: string
          description: |-
            Duration/span of the time window

            The returned statistics will be for the time window from `end` - `interval` to `end`.
            Specify a ISO8601 duration string, e.g. `PT1H` for 1 hour, `P1D` for 1 day.
          example: P1D
        type:
          type: string
          enum:
            - window
      example:
        type: window
        end: 2023-12-31T23:59:59Z
        interval: P1D
    TopLevelFolder:
      type: string
      description: |-
        Top-level managed folder within a Fabric lakehouse.

        Fabric reserves `Files/` and `Tables/` as managed folders directly under
        each lakehouse item. `Files/` is the default for Lakekeeper-managed Iceberg
        tables; `Tables/` is supported for completeness but writing Iceberg metadata
        there conflicts with Fabric's automatic Delta/Iceberg virtualization.
      enum:
