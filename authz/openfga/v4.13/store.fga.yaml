name: Lakekeeper Core
model_file: ./fga.mod
tuples:
  # Hierarchies: server_1 -> project_1 -> (warehouse_1 (unmanaged), warehouse_2 (managed access))
  - user: server:server_1
    relation: server
    object: project:project_1
  - user: project:project_1
    relation: project
    object: server:server_1
  - user: warehouse:warehouse_1
    relation: warehouse
    object: project:project_1
  - user: project:project_1
    relation: project
    object: warehouse:warehouse_1
  - user: warehouse:warehouse_2
    relation: warehouse
    object: project:project_1
  - user: project:project_1
    relation: project
    object: warehouse:warehouse_2
  # Hierarchies: warehouse_1 -> namespace_1 -> (table_1, table_2)
  - user: warehouse:warehouse_1
    relation: parent
    object: namespace:namespace_1
  - user: namespace:namespace_1
    relation: namespace
    object: warehouse:warehouse_1
  - user: lakekeeper_table:warehouse_1/table_1
    relation: child
    object: namespace:namespace_1
  - user: namespace:namespace_1
    relation: parent
    object: lakekeeper_table:warehouse_1/table_1
  # Hierarchies: warehouse_1 -> namespace_1_1 -> namespace_1_2 -> (table_3, view_1)
  - user: warehouse:warehouse_1
    relation: parent
    object: namespace:namespace_1_1
  - user: namespace:namespace_1_1
    relation: namespace
    object: warehouse:warehouse_1
  - user: namespace:namespace_1_1
    relation: parent
    object: namespace:namespace_1_2
  - user: namespace:namespace_1_2
    relation: child
    object: namespace:namespace_1_1
  - user: lakekeeper_table:warehouse_1/table_3
    relation: child
    object: namespace:namespace_1_2
  - user: namespace:namespace_1_2
    relation: parent
    object: lakekeeper_table:warehouse_1/table_3
  - user: lakekeeper_view:warehouse_1/view_1
    relation: child
    object: namespace:namespace_1_2
  - user: namespace:namespace_1_2
    relation: parent
    object: lakekeeper_view:warehouse_1/view_1
  # Hierarchies: warehouse_2 -> namespace_2_1 -> namespace_2_2 -> table_2_2
  - user: warehouse:warehouse_2
    relation: parent
    object: namespace:namespace_2_1
  - user: namespace:namespace_2_1
    relation: namespace
    object: warehouse:warehouse_2
  - user: namespace:namespace_2_1
    relation: parent
    object: namespace:namespace_2_2
  - user: namespace:namespace_2_2
    relation: child
    object: namespace:namespace_2_1
  - user: lakekeeper_table:warehouse_2/table_2_2
    relation: child
    object: namespace:namespace_2_2
  - user: namespace:namespace_2_2
    relation: parent
    object: lakekeeper_table:warehouse_2/table_2_2
  # A direct manage_grants assignment inside the managed subtree. managed_access strips
  # manage_grants from *owners*, but not from an explicit assignment — so this principal
  # keeps grant authority. It still cannot move the namespace: can_move also needs modify.
  - user: user:namespace_2_1_grant_admin
    relation: manage_grants
    object: namespace:namespace_2_1
  # Direct manage_grants plus ownership: ownership supplies modify and create, the direct
  # assignment survives managed_access, so this principal can move out of the managed subtree.
  - user: user:namespace_2_1_move_admin
    relation: manage_grants
    object: namespace:namespace_2_1
  - user: user:namespace_2_1_move_admin
    relation: ownership
    object: namespace:namespace_2_1
  # warehouse_2 has managed access
  - user: role:*
    relation: managed_access
    object: warehouse:warehouse_2
  - user: user:*
    relation: managed_access
    object: warehouse:warehouse_2
  # Roles (Server Admin)
  - user: user:admin
    relation: admin
    object: server:server_1
  - user: user:operator
    relation: operator
    object: server:server_1
  # Roles (Project 1 project admin)
  - user: user:project_1_project_admin
    relation: project_admin
    object: project:project_1
  # Roles (Project 1 security admin)
  - user: user:project_1_security_admin
    relation: security_admin
    object: project:project_1
  # Roles (Project 1 warehouse admin)
  - user: user:project_1_data_admin
    relation: data_admin
    object: project:project_1
  # Roles (Warehouse 1 owner)
  - user: user:warehouse_1_owner
    relation: ownership
    object: warehouse:warehouse_1
  # Roles (Namespace 2 Owner)
  - user: user:namespace_1_1_owner
    relation: ownership
    object: namespace:namespace_1_1
  # Roles (Select on Table 3)
  - user: user:select_table_3
    relation: assignee
    object: role:select_table_3
  - user: role:select_table_3#assignee
    relation: select
    object: lakekeeper_table:warehouse_1/table_3
  # Hierarchies: generic_table_1 under namespace_1_2 (sibling of table_3, view_1)
  - user: lakekeeper_generic_table:warehouse_1/generic_table_1
    relation: child
    object: namespace:namespace_1_2
  - user: namespace:namespace_1_2
    relation: parent
    object: lakekeeper_generic_table:warehouse_1/generic_table_1
  # Roles (Select on Generic Table 1) — role-based grant on a generic table
  - user: user:select_generic_table_1
    relation: assignee
    object: role:select_generic_table_1
  - user: role:select_generic_table_1#assignee
    relation: select
    object: lakekeeper_generic_table:warehouse_1/generic_table_1
  # Hierarchies: dataset_1 under namespace_1_2 (sibling of table_3, generic_table_1)
  - user: lakekeeper_dataset:warehouse_1/dataset_1
    relation: child
    object: namespace:namespace_1_2
  - user: namespace:namespace_1_2
    relation: parent
    object: lakekeeper_dataset:warehouse_1/dataset_1
  # Roles (Select on Dataset 1) — a reader pinned to a dataset, no write authority
  - user: user:select_dataset_1
    relation: assignee
    object: role:select_dataset_1
  - user: role:select_dataset_1#assignee
    relation: select
    object: lakekeeper_dataset:warehouse_1/dataset_1
  # Roles (Modify on Dataset 1) — a pipeline that commits and promotes but must
  # not be able to reset a branch onto a non-descendant snapshot
  - user: user:modify_dataset_1
    relation: assignee
    object: role:modify_dataset_1
  - user: role:modify_dataset_1#assignee
    relation: modify
    object: lakekeeper_dataset:warehouse_1/dataset_1
  # Hierarchies: generic_table_2_2 under managed-access namespace_2_2
  - user: lakekeeper_generic_table:warehouse_2/generic_table_2_2
    relation: child
    object: namespace:namespace_2_2
  - user: namespace:namespace_2_2
    relation: parent
    object: lakekeeper_generic_table:warehouse_2/generic_table_2_2
  # Roles (Owner on warehouse_2)
  - user: user:warehouse_2_owner
    relation: ownership
    object: warehouse:warehouse_2
  # Roles (Owner on namespace_2_1)
  - user: user:namespace_2_1_owner
    relation: ownership
    object: namespace:namespace_2_1
  # Roles (Owner on namespace_2_2)
  - user: user:namespace_2_2_owner
    relation: ownership
    object: namespace:namespace_2_2
  - user: user:warehouse_2/table_2_2_owner
    relation: ownership
    object: lakekeeper_table:warehouse_2/table_2_2
  # Roles (Owner role on namespace_2_1)
  - user: role:namespace_2_1_owner#assignee
    relation: ownership
    object: namespace:namespace_2_1
  - user: user:namespace_2_1_role_owner
    relation: assignee
    object: role:namespace_2_1_owner
  # Make user owner of role
  - user: user:owner_of_role_namespace_2_1_owner
    relation: ownership
    object: role:namespace_2_1_owner
  # ---- Governance tags (v4.10) ----
  # A tag definition parented to project_1
  - user: project:project_1
    relation: project
    object: lakekeeper_catalog_tag:tag_pii
  # Project security admin (governs the tag vocabulary + attachment)
  - user: user:sec_admin
    relation: security_admin
    object: project:project_1
  # Plain data admin: has `modify` everywhere, must NOT get manage_tags (SoD)
  - user: user:data_admin_u
    relation: data_admin
    object: project:project_1
  # Tag owner
  - user: user:tag_owner
    relation: ownership
    object: lakekeeper_catalog_tag:tag_pii
  # Per-tag apply delegation: may apply tag_pii, nothing else
  - user: user:tag_applier
    relation: apply
    object: lakekeeper_catalog_tag:tag_pii
  # Steward: manage_tags on table_1 only (no modify, no tag grant)
  - user: user:steward
    relation: manage_tags
    object: lakekeeper_table:warehouse_1/table_1
  # Tag steward: may create tag definitions, but is not a security admin
  - user: user:tag_steward
    relation: tag_creator
    object: project:project_1
  # Delegator: holds `select` and may pass it on, but holds no grant administration.
  # Used to pin that delegation is one-directional.
  - user: user:namespace_1_delegator
    relation: select
    object: namespace:namespace_1
  - user: user:namespace_1_delegator
    relation: pass_grants
    object: namespace:namespace_1
  # A principal holding `describe` on warehouse_1 and nothing else.
  - user: user:warehouse_1_describe_only
    relation: describe
    object: warehouse:warehouse_1
  # One holder per remaining privilege, so every leg of `visible_below` has a
  # source that no other fixture supplies.
  - user: user:warehouse_1_select_only
    relation: select
    object: warehouse:warehouse_1
  - user: user:warehouse_1_create_only
    relation: create
    object: warehouse:warehouse_1
  - user: user:warehouse_1_modify_only
    relation: modify
    object: warehouse:warehouse_1
  - user: user:namespace_1_describe_only
    relation: describe
    object: namespace:namespace_1
  - user: user:namespace_1_modify_only
    relation: modify
    object: namespace:namespace_1
  - user: user:namespace_1_2_create_only
    relation: create
    object: namespace:namespace_1_2
  - user: user:view_1_modify_only
    relation: modify
    object: lakekeeper_view:warehouse_1/view_1

tests:
  - name: Tags - project security admin governs vocabulary and attachment
    check:
      - user: user:sec_admin
        object: project:project_1
        assertions:
          can_create_tag: true
          can_list_tags: true
      - user: user:sec_admin
        object: lakekeeper_catalog_tag:tag_pii
        assertions:
          can_read: true
          can_update: true
          can_delete: true
          can_apply: true
          can_grant_apply: true
          can_read_assignments: true   # grant inspection (who may apply/owns)
          can_read_attachments: true   # reverse lookup (which objects carry it)
      - user: user:sec_admin
        object: lakekeeper_table:warehouse_1/table_1
        assertions:
          can_manage_tags: true
  - name: Tags - SoD, data_admin has modify but never manage_tags
    check:
      - user: user:data_admin_u
        object: lakekeeper_table:warehouse_1/table_1
        assertions:
          can_write_data: true
          can_manage_tags: false
      - user: user:data_admin_u
        object: lakekeeper_catalog_tag:tag_pii
        assertions:
          can_apply: false
          can_update: false
          can_read_attachments: false   # table modify rights do not grant enumerating attachments
  - name: Tags - owner manages the definition, attaching still needs target manage_tags
    check:
      - user: user:tag_owner
        object: lakekeeper_catalog_tag:tag_pii
        assertions:
          can_read: true
          can_update: true
          can_delete: true
          can_apply: true
          can_grant_apply: true
          can_read_attachments: true
          can_read_assignments: true   # owner may inspect who holds grants (ownership arm)
      - user: user:tag_owner
        object: lakekeeper_table:warehouse_1/table_1
        assertions:
          can_manage_tags: false
  - name: Tags - per-tag apply delegation is scoped to the definition
    check:
      - user: user:tag_applier
        object: lakekeeper_catalog_tag:tag_pii
        assertions:
          can_read: true
          can_apply: true
          can_update: false
          can_delete: false
          can_grant_apply: false
          can_read_attachments: false   # applying a tag does not grant enumerating its attachments
          can_read_assignments: false   # nor reading who else may apply it (grant inspection)
      - user: user:tag_applier
        object: lakekeeper_table:warehouse_1/table_1
        assertions:
          can_manage_tags: false
  - name: Tags - steward manages tags on a resource without modify or a tag grant
    check:
      - user: user:steward
        object: lakekeeper_table:warehouse_1/table_1
        assertions:
          can_manage_tags: true
          can_write_data: false
      - user: user:steward
        object: lakekeeper_catalog_tag:tag_pii
        assertions:
          can_apply: false
          can_read_attachments: false   # resource manage_tags does not grant enumerating attachments
  - name: Tags - tag_creator delegates definition creation without security_admin
    check:
      - user: user:tag_steward
        object: project:project_1
        assertions:
          can_create_tag: true
          can_grant_tag_creator: false   # not a security admin / server admin
          can_read_assignments: false    # not a security admin
      - user: user:sec_admin
        object: project:project_1
        assertions:
          can_create_tag: true           # security_admin still creates (superset)
          can_grant_tag_creator: true
      - user: user:data_admin_u
        object: project:project_1
        assertions:
          can_create_tag: false          # data admin cannot create tags (SoD)
  - name: Test Almighty Operator
    check:
      - user: user:operator
        object: server:server_1
        assertions:
            can_create_project: true
            can_list_all_projects: true
            can_update_users: true
            can_delete_users: true
            can_grant_operator: true
            can_read_assignments: true
      - user: user:operator
        object: project:project_1
        assertions:
          can_create_warehouse: true
          can_delete: true
          can_get_metadata: true
          can_list_warehouses: true
          can_include_in_list: true
          can_rename: true
          can_grant_create: true
          can_grant_describe: true
          can_grant_modify: true
          can_grant_select: true
          can_grant_project_admin: true
          can_grant_security_admin: true
          can_grant_data_admin: true
  - name: Test Global Admin
    check:
      - user: user:admin
        object: server:server_1
        assertions:
          can_create_project: true
          can_list_all_projects: true
          can_update_users: true
          can_delete_users: true
          can_grant_operator: true
          can_read_assignments: true
      - user: user:admin
        object: project:project_1
        assertions:
          can_create_warehouse: false
          can_delete: false
          can_get_metadata: true
          can_list_warehouses: true
          can_include_in_list: true
          can_rename: false
          can_grant_create: true
          can_grant_describe: true
          can_grant_modify: true
          can_grant_select: true
          can_grant_project_admin: true
          can_grant_security_admin: true
          can_grant_data_admin: true
      - user: user:admin
        object: warehouse:warehouse_1
        assertions:
          can_create_namespace: false
          can_delete: false
          can_update_storage: false
          can_update_storage_credential: false
          can_get_metadata: false
          can_get_config: false
          can_list_namespaces: false
          can_list_everything: false
          can_use: false
          can_include_in_list: false
          can_deactivate: false
          can_activate: false
          can_rename: false
          can_list_deleted_tabulars: false
          can_grant_create: false
          can_grant_describe: false
          can_grant_modify: false
          can_grant_select: false
          can_grant_pass_grants: false
          can_grant_manage_grants: false
          can_change_ownership: false
      - user: user:admin
        object: namespace:namespace_1
        assertions:
          can_create_table: false
          can_create_view: false
          can_create_namespace: false
          # A server admin holds nothing inside a project, so neither half of either
          # intersection is satisfied.
          can_accept_moved_namespace: false
          can_delete: false
          can_move: false
          can_update_properties: false
          can_get_metadata: false
          can_list_tables: false
          can_list_views: false
          can_list_namespaces: false
          can_list_everything: false
          can_grant_create: false
          can_grant_describe: false
          can_grant_modify: false
          can_grant_select: false
          can_grant_pass_grants: false
          can_grant_manage_grants: false
          can_change_ownership: false
      - user: user:admin
        object: lakekeeper_table:warehouse_1/table_3
        assertions:
          can_drop: false
          can_write_data: false
          can_read_data: false
          can_get_metadata: false
          can_commit: false
          can_rename: false
          can_include_in_list: false
          can_grant_pass_grants: false
          can_grant_manage_grants: false
          can_grant_describe: false
          can_grant_select: false
          can_grant_modify: false
          can_change_ownership: false
      - user: user:admin
        object: lakekeeper_view:warehouse_1/view_1
        assertions:
          can_drop: false
          can_commit: false
          can_get_metadata: false
          can_select: false
          can_rename: false
          can_include_in_list: false
          can_grant_pass_grants: false
          can_grant_manage_grants: false
          can_grant_describe: false
          can_grant_select: false
          can_grant_modify: false
          can_change_ownership: false
  - name: Project Admin has full access in project and below
    check:
      - user: user:project_1_project_admin
        object: project:project_1
        assertions:
          can_create_warehouse: true
          can_delete: true
          can_get_metadata: true
          can_list_warehouses: true
          can_include_in_list: true
          can_rename: true
          can_grant_create: true
          can_grant_describe: true
          can_grant_modify: true
          can_grant_select: true
          can_grant_project_admin: true
          can_grant_security_admin: true
          can_grant_data_admin: true
      - user: user:project_1_project_admin
        object: warehouse:warehouse_1
        assertions:
          can_create_namespace: true
          can_delete: true
          can_update_storage: true
          can_update_storage_credential: true
          can_get_metadata: true
          can_get_config: true
          can_list_namespaces: true
          can_list_everything: true
          can_use: true
          can_include_in_list: true
          can_deactivate: true
          can_activate: true
          can_rename: true
          can_list_deleted_tabulars: true
          can_grant_create: true
          can_grant_describe: true
          can_grant_modify: true
          can_grant_select: true
          can_grant_pass_grants: true
          can_grant_manage_grants: true
          can_change_ownership: true
      - user: user:project_1_project_admin
        object: namespace:namespace_1
        assertions:
          can_create_table: true
          can_create_view: true
          can_create_namespace: true
          can_delete: true
          can_update_properties: true
          can_get_metadata: true
          can_list_tables: true
          can_list_views: true
          can_list_namespaces: true
          can_list_everything: true
          can_grant_create: true
          can_grant_describe: true
          can_grant_modify: true
          can_grant_select: true
          can_grant_pass_grants: true
          can_grant_manage_grants: true
          can_change_ownership: true
      - user: user:project_1_project_admin
        object: lakekeeper_table:warehouse_1/table_3
        assertions:
          can_drop: true
          can_write_data: true
          can_read_data: true
          can_get_metadata: true
          can_commit: true
          can_rename: true
          can_include_in_list: true
          can_grant_pass_grants: true
          can_grant_manage_grants: true
          can_grant_describe: true
          can_grant_select: true
          can_grant_modify: true
          can_change_ownership: true
      - user: user:project_1_project_admin
        object: lakekeeper_view:warehouse_1/view_1
        assertions:
          can_drop: true
          can_commit: true
          can_get_metadata: true
          can_select: true
          can_rename: true
          can_include_in_list: true
          can_grant_pass_grants: true
          can_grant_manage_grants: true
          can_grant_describe: true
          can_grant_select: true
          can_grant_modify: true
          can_change_ownership: true
  - name: Security Admin can manage grants and navigate but not see data
    check:
      - user: user:project_1_security_admin
        object: project:project_1
        assertions:
          can_create_warehouse: false
          can_delete: false
          can_get_metadata: true
          can_list_warehouses: true
          can_include_in_list: true
          can_rename: false
          can_grant_create: true
          can_grant_describe: true
          can_grant_modify: true
          can_grant_select: true
          can_grant_project_admin: false
          can_grant_security_admin: true
          can_grant_data_admin: true
      - user: user:project_1_security_admin
        object: warehouse:warehouse_1
        assertions:
          can_create_namespace: false
          # manage_grants without create: grant authority alone cannot accept an inbound move
          # at the warehouse root.
          can_accept_moved_namespace: false
          can_delete: false
          can_update_storage: false
          can_update_storage_credential: false
          can_get_metadata: true
          can_get_config: true
          can_list_namespaces: true
          can_list_everything: true
          can_use: true
          can_include_in_list: true
          can_deactivate: false
          can_activate: false
          can_rename: false
          can_list_deleted_tabulars: true
          can_grant_create: true
          can_grant_describe: true
          can_grant_modify: true
          can_grant_select: true
          can_grant_pass_grants: true
          can_grant_manage_grants: true
          can_change_ownership: true
      - user: user:project_1_security_admin
        object: namespace:namespace_1
        assertions:
          can_create_table: false
          can_create_view: false
          can_create_namespace: false
          can_accept_moved_namespace: false
          can_delete: false
          # can_move is manage_grants AND modify: grant authority alone no longer restructures
          # the hierarchy — a security_admin without write access cannot move. can_move is
          # therefore strictly stronger than can_delete.
          can_move: false
          can_update_properties: false
          can_get_metadata: true
          can_list_tables: true
          can_list_views: true
          can_include_in_list: true
          can_list_namespaces: true
          can_list_everything: true
          can_grant_create: true
          can_grant_describe: true
          can_grant_modify: true
          can_grant_select: true
          can_grant_pass_grants: true
          can_grant_manage_grants: true
          can_change_ownership: true
      - user: user:project_1_security_admin
        object: lakekeeper_table:warehouse_1/table_3
        assertions:
          can_drop: false
          can_write_data: false
          can_read_data: false
          can_get_metadata: true
          can_commit: false
          can_rename: false
          can_include_in_list: true
          can_grant_pass_grants: true
          can_grant_manage_grants: true
          can_grant_describe: true
          can_grant_select: true
          can_grant_modify: true
          can_change_ownership: true
      - user: user:project_1_security_admin
        object: lakekeeper_view:warehouse_1/view_1
        assertions:
          can_drop: false
          can_commit: false
          can_get_metadata: true
          can_select: false
          can_rename: false
          can_include_in_list: true
          can_grant_pass_grants: true
          can_grant_manage_grants: true
          can_grant_describe: true
          can_grant_select: true
          can_grant_modify: true
          can_change_ownership: true
  - name: Warehouse Admin can manage data and objects but not grants
    check:
      - user: user:project_1_data_admin
        object: project:project_1
        assertions:
          can_create_warehouse: true
          can_delete: false
          can_get_metadata: true
          can_list_warehouses: true
          can_include_in_list: true
          can_rename: false
          can_grant_create: false
          can_grant_describe: false
          can_grant_modify: false
          can_grant_select: false
          can_grant_project_admin: false
          can_grant_security_admin: false
          can_grant_data_admin: false
      - user: user:project_1_data_admin
        object: warehouse:warehouse_1
        assertions:
          can_create_namespace: true
          # The mirror image: create without manage_grants.
          can_accept_moved_namespace: false
          can_delete: true
