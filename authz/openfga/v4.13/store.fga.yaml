  - name: pass_grants delegates handing out, never taking back
    check:
      - user: user:namespace_1_delegator
        object: namespace:namespace_1
        assertions:
          can_grant_select: true       # holds select and pass_grants, so may pass it on
          can_revoke_select: false     # taking it back is administration, not delegation
          can_grant_describe: true     # select implies describe, so describe is passable too
          can_revoke_describe: false
          can_grant_modify: false      # not held, so not passable in either direction
          can_revoke_modify: false
      - user: user:namespace_2_1_grant_admin
        object: namespace:namespace_2_1
        assertions:
          can_grant_select: true       # manage_grants administers both directions
          can_revoke_select: true
          can_revoke_describe: true
          can_revoke_modify: true
      - user: user:warehouse_1_owner
        object: namespace:namespace_1
        assertions:
          can_revoke_select: true      # manage_grants inherits from the parent warehouse
  - name: subtree grant actions follow manage_grants down, never pass_grants
    check:
      - user: user:warehouse_1_owner
        object: warehouse:warehouse_1
        assertions:
          can_read_subtree_assignments: true    # ownership confers manage_grants
          can_revoke_subtree_assignments: true
      - user: user:warehouse_1_owner
        object: namespace:namespace_1
        assertions:
          can_read_subtree_assignments: true    # manage_grants inherits from the warehouse
          can_revoke_subtree_assignments: true
      - user: user:namespace_1_1_owner
        object: namespace:namespace_1_1
        assertions:
          can_read_subtree_assignments: true
          can_revoke_subtree_assignments: true
      - user: user:namespace_1_1_owner
        object: namespace:namespace_1_2
        assertions:
          can_read_subtree_assignments: true    # follows manage_grants down to the child
          can_revoke_subtree_assignments: true
      - user: user:namespace_1_1_owner
        object: warehouse:warehouse_1
        assertions:
          can_read_subtree_assignments: false   # nothing flows upward
          can_revoke_subtree_assignments: false
      - user: user:namespace_1_delegator
        object: namespace:namespace_1
        assertions:
          can_read_assignments: true            # pass_grants reads one resource's grants
          can_read_subtree_assignments: false   # and never enumerates the subtree
          can_revoke_subtree_assignments: false # nor sweeps it
  # Every level that publishes a revoke action, asserted at least once in each
  # direction. Nothing cross-checks the model against the Rust relation enums, so a
  # level missing a `can_revoke_*` rule would otherwise surface only as a runtime
  # "relation not found" from OpenFGA.
  - name: revoke actions resolve at every level that publishes them
    check:
      - user: user:warehouse_1_owner
        object: warehouse:warehouse_1
        assertions:
          can_revoke_create: true      # ownership confers manage_grants here
          can_revoke_describe: true
          can_revoke_modify: true
          can_revoke_select: true
      - user: user:namespace_2_1_grant_admin
        object: namespace:namespace_2_1
        assertions:
          can_revoke_create: true      # the namespace-level `create` counterpart
      - user: user:namespace_1_delegator
        object: namespace:namespace_1
        assertions:
          can_grant_create: false      # `create` is not held, so not passable either way
          can_revoke_create: false
      - user: user:warehouse_1_owner
        object: lakekeeper_table:warehouse_1/table_1
        assertions:
          can_revoke_describe: true    # manage_grants inherits down to the tabular
          can_revoke_modify: true
          can_revoke_select: true
      # `pass_grants` is directly assignable at every level and never inherits, unlike
      # `select` (which does) and `manage_grants` (which does). So delegation is scoped
      # to the exact object it was granted on: this holder's namespace-level
      # `pass_grants` gives it nothing on the table below, in either direction.
      - user: user:namespace_1_delegator
        object: lakekeeper_table:warehouse_1/table_1
        assertions:
          can_grant_select: false
          can_revoke_select: false
          can_revoke_describe: false
          can_revoke_modify: false
      - user: user:warehouse_1_owner
        object: lakekeeper_view:warehouse_1/view_1
        assertions:
          can_revoke_describe: true
          can_revoke_modify: true
          can_revoke_select: true
      - user: user:namespace_1_delegator
        object: lakekeeper_view:warehouse_1/view_1
        assertions:
          can_revoke_describe: false   # holds nothing on this subtree
          can_revoke_modify: false
          can_revoke_select: false
      - user: user:warehouse_1_owner
        object: lakekeeper_generic_table:warehouse_1/generic_table_1
        assertions:
          can_revoke_describe: true
          can_revoke_modify: true
          can_revoke_select: true
      - user: user:namespace_1_delegator
        object: lakekeeper_generic_table:warehouse_1/generic_table_1
        assertions:
          can_revoke_describe: false
          can_revoke_modify: false
          can_revoke_select: false

  - name: warehouse describe alone reaches use, config and listing
    # A warehouse-level `describe` held alone, reaching every navigation action
    # above and below it. The only place the `describe` leg of
    # `warehouse.visible_below` is exercised on its own.
    check:
      - user: user:warehouse_1_describe_only
        object: warehouse:warehouse_1
        assertions:
          can_use: true
          can_get_config: true
          can_get_metadata: true
          can_include_in_list: true
          can_list_namespaces: true
          can_list_everything: true
          can_list_deleted_tabulars: true
          can_get_task_queue_config: true
          # describe carries navigation only, never data or administration.
          can_create_namespace: false
          can_delete: false
          can_modify_task_queue_config: false
          can_grant_describe: false
      - user: user:warehouse_1_describe_only
        object: project:project_1
        assertions:
          # Visibility bubbles up from the warehouse grant.
          can_get_metadata: true
          can_include_in_list: true
          can_list_warehouses: true
          can_create_warehouse: false
      - user: user:warehouse_1_describe_only
        object: namespace:namespace_1
        assertions:
          # and flows down to everything inside.
          can_get_metadata: true
          can_list_tables: true
          can_list_everything: true
          can_create_table: false
      - user: user:warehouse_1_describe_only
        object: lakekeeper_table:warehouse_1/table_1
        assertions:
          can_get_metadata: true
          can_include_in_list: true
          can_read_data: false
          can_commit: false

  - name: granted privileges are direct, effective privileges include what is implied
    # Pins the split: the bare relation answers "granted on this object", the
    # `_effective` twin answers "holds it here". Grant listings read the bare
    # relation, so a rewrite that collapsed the two would silently widen them.
    check:
      - user: user:warehouse_1_describe_only
        object: warehouse:warehouse_1
        assertions:
          describe: true            # granted right here
          describe_effective: true
          select: false
          select_effective: false
      - user: user:warehouse_1_describe_only
        object: namespace:namespace_1
        assertions:
          describe: false           # nothing was granted on the namespace
          describe_effective: true  # it is inherited from the warehouse
          visible_below: false      # and inheritance never makes a descendant a source
      - user: user:warehouse_1_describe_only
        object: lakekeeper_table:warehouse_1/table_1
        assertions:
          describe: false
          describe_effective: true
          visible_below: false
      - user: user:namespace_1_1_owner
        object: namespace:namespace_1_1
        assertions:
          # Ownership is held on the object, so it is a visibility source even
          # though no privilege relation was written for this principal.
          describe: false
          describe_effective: true
          visible_below: true
      - user: user:select_table_3
        object: lakekeeper_table:warehouse_1/table_3
        assertions:
          # A directly granted `select` implies describe, and is a source.
          select: true
          describe: false
          describe_effective: true
          visible_below: true
      - user: user:select_table_3
        object: warehouse:warehouse_1
        assertions:
          # Nothing granted at the warehouse, but a grant below makes it visible.
          describe: false
          describe_effective: false
          visible_below: true
          can_use: true
          can_get_config: true

  - name: every grantable privilege is a visibility source at its own level
    # Each leg of `visible_below` on its own: a principal holding exactly one
    # privilege stays visible in the listings above the object it was granted on.
    check:
      - user: user:warehouse_1_describe_only
        object: warehouse:warehouse_1
        assertions:
          visible_below: true
      - user: user:warehouse_1_select_only
        object: warehouse:warehouse_1
        assertions:
          visible_below: true
      - user: user:warehouse_1_create_only
        object: warehouse:warehouse_1
        assertions:
          visible_below: true
      - user: user:warehouse_1_modify_only
        object: warehouse:warehouse_1
        assertions:
          visible_below: true
      - user: user:warehouse_1_owner
        object: warehouse:warehouse_1
        assertions:
          visible_below: true
      # The warehouse legs carry the project listing: this is the only path by
      # which a warehouse-level grant reaches `project.can_get_metadata`.
      - user: user:warehouse_1_select_only
        object: project:project_1
        assertions:
          can_get_metadata: true
          can_list_warehouses: true
      - user: user:warehouse_1_create_only
        object: project:project_1
        assertions:
          can_get_metadata: true
      - user: user:warehouse_1_modify_only
        object: project:project_1
        assertions:
          can_get_metadata: true
      - user: user:warehouse_1_owner
        object: project:project_1
        assertions:
          can_get_metadata: true
          can_list_warehouses: true
          can_create_warehouse: false
      - user: user:namespace_1_describe_only
        object: namespace:namespace_1
        assertions:
          visible_below: true
      - user: user:namespace_1_delegator
        object: namespace:namespace_1
        assertions:
          visible_below: true
      - user: user:namespace_1_modify_only
        object: namespace:namespace_1
        assertions:
          visible_below: true
      - user: user:namespace_1_2_create_only
        object: namespace:namespace_1_2
        assertions:
          visible_below: true
      - user: user:namespace_1_1_owner
        object: namespace:namespace_1_1
        assertions:
          visible_below: true
      - user: user:namespace_1_describe_only
        object: warehouse:warehouse_1
        assertions:
          can_get_metadata: true
      - user: user:namespace_1_delegator
        object: warehouse:warehouse_1
        assertions:
          can_get_metadata: true
      - user: user:namespace_1_modify_only
        object: warehouse:warehouse_1
        assertions:
          can_get_metadata: true
      - user: user:select_table_3
        object: lakekeeper_table:warehouse_1/table_3
        assertions:
          visible_below: true
      - user: user:warehouse_2/table_2_2_owner
        object: lakekeeper_table:warehouse_2/table_2_2
        assertions:
          visible_below: true
      - user: user:warehouse_2/table_2_2_owner
        object: namespace:namespace_2_2
        assertions:
          visible_below: true
          describe_effective: false
          can_get_metadata: true
      - user: user:view_1_modify_only
        object: lakekeeper_view:warehouse_1/view_1
        assertions:
          visible_below: true
      - user: user:select_generic_table_1
        object: lakekeeper_generic_table:warehouse_1/generic_table_1
        assertions:
          visible_below: true

  - name: modify on a view implies select and describe and bubbles up
    # A direct `modify` on a view exercises `lakekeeper_view`'s split relations
    # and the visibility it propagates to every ancestor.
    check:
      - user: user:view_1_modify_only
        object: lakekeeper_view:warehouse_1/view_1
        assertions:
          modify: true
          select: false
          describe: false
          modify_effective: true
          select_effective: true
          describe_effective: true
          visible_below: true
          can_commit: true
          can_select: true
          can_get_metadata: true
      - user: user:view_1_modify_only
        object: namespace:namespace_1_2
        assertions:
          visible_below: true
          describe_effective: false
          can_get_metadata: true
          can_list_views: true
          can_create_view: false
      - user: user:view_1_modify_only
        object: warehouse:warehouse_1
        assertions:
          visible_below: true
          can_use: true
          can_get_config: true
      - user: user:view_1_modify_only
        object: project:project_1
        assertions:
          can_get_metadata: true
          can_list_warehouses: true
      - user: user:view_1_modify_only
        object: lakekeeper_table:warehouse_1/table_3
        assertions:
          # A sibling under the same namespace: nothing flows sideways.
          describe_effective: false
          visible_below: false
          can_get_metadata: false

  - name: create alone below the warehouse is a visibility source
    # A direct `create` on a namespace exercises `create_effective`, the
    # `describe_effective` it implies, and visibility at every ancestor.
    check:
      - user: user:namespace_1_2_create_only
        object: namespace:namespace_1_2
        assertions:
          create: true
          describe: false
          describe_effective: true
          visible_below: true
          can_create_table: true
          can_get_metadata: true
      - user: user:namespace_1_2_create_only
        object: namespace:namespace_1_1
        assertions:
          visible_below: true
          describe_effective: false
          can_get_metadata: true
          can_list_namespaces: true
          can_create_namespace: false
      - user: user:namespace_1_2_create_only
        object: warehouse:warehouse_1
        assertions:
          visible_below: true
          describe_effective: false
          can_get_metadata: true
          can_use: true
          can_list_everything: false
      - user: user:namespace_1_2_create_only
        object: namespace:namespace_1
        assertions:
          # A sibling subtree: nothing flows sideways.
          visible_below: false
          can_get_metadata: false
      - user: user:namespace_1_2_create_only
        object: lakekeeper_table:warehouse_1/table_3
        assertions:
          # `create` implies `describe` on the namespace, which flows down to its
          # contents; the grant itself stays on the namespace.
          describe_effective: true
          visible_below: false
          can_get_metadata: true
          can_read_data: false

  - name: a project grant flows down as effective only, never as a stored grant
    # Grant listings read the bare relation, so inheritance must never populate it.
    check:
      - user: user:project_1_data_admin
        object: project:project_1
        assertions:
          describe: false
          describe_effective: true
          create: false
          create_effective: true
      - user: user:project_1_data_admin
        object: warehouse:warehouse_1
        assertions:
          describe: false
          describe_effective: true
          visible_below: false
          can_get_metadata: true
          can_list_everything: true
          can_create_namespace: true
      - user: user:project_1_data_admin
        object: namespace:namespace_1_2
        assertions:
          describe: false
          describe_effective: true
          visible_below: false
          can_get_metadata: true
      - user: user:project_1_data_admin
        object: lakekeeper_table:warehouse_1/table_3
        assertions:
          describe: false
          describe_effective: true
          visible_below: false
          can_get_metadata: true
