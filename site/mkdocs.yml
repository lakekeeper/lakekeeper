site_name: Lakekeeper Docs
repo_url: https://github.com/lakekeeper/lakekeeper
# `site_url` is load-bearing for SEO, not cosmetic. Without it MkDocs emits an
# empty `sitemap.xml`, mkdocs-material skips `<link rel="canonical">` entirely,
# and `page.canonical_url` renders as the literal string "None" into the Open
# Graph tags in `overrides/main.html`. Keep the trailing slash.
site_url: https://docs.lakekeeper.io/
site_description: Lakekeeper is an open source Apache Iceberg REST Catalog written in Rust, with fine-grained access control, multi-engine support and S3, GCS & Azure storage.
site_author: Lakekeeper Team
edit_uri: blob/main/docs/

# Link validation. The monorepo plugin builds each version as a separate unit, so
# cross-unit / shared-asset links (../../assets, ../../about, ../../getting-started)
# can't be resolved here — they only resolve in the assembled site — so keep them at
# `info`. Anchors are per-page, so broken anchors ARE real — keep them as warnings.
# `just linkcheck` validates the assembled site (lychee) as the real gate.
validation:
  links:
    not_found: info
    anchors: warn
    absolute_links: info

theme:
  custom_dir: overrides
  name: material
  palette:
    scheme: lakekeeper
  logo: assets/bear.svg
  favicon: assets/bear.svg
  locale: en
  highlightjs: true
  hljs_languages:
    - yaml
    - rust
    - bash
    - json
  shortcuts:
    help: 191 # ?
    next: 78 # n
    previous: 80 # p
    search: 83 # s
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.tracking
    - navigation.footer
    - toc.follow
    - offline
    - search.suggest
    - search.highlight
    - content.tabs.link
    - content.code.copy
    - content.code.annotate

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Production: production.md
  # `versions/` is the docs-branch worktree, deliberately outside docs_dir — see
  # dev/common.sh. Public URLs come from each unit's `site_name` (`docs/<version>`),
  # not from this path, so they are unaffected by where the worktree lives.
  - Docs:
      - nightly: "!include versions/nightly/mkdocs.yml"
      - latest: "!include versions/latest/mkdocs.yml"
      - Release 0.13.x: "!include versions/0.13.x/mkdocs.yml"
      - Release 0.12.x: "!include versions/0.12.x/mkdocs.yml"
      - Release 0.11.x: "!include versions/0.11.x/mkdocs.yml"
      - Release 0.10.x: "!include versions/0.10.x/mkdocs.yml"
      - Release 0.9.x: "!include versions/0.9.x/mkdocs.yml"
      - Release 0.8.x: "!include versions/0.8.x/mkdocs.yml"
      - Release 0.7.x: "!include versions/0.7.x/mkdocs.yml"
      - Release 0.6.x: "!include versions/0.6.x/mkdocs.yml"
      - Release 0.5.x: "!include versions/0.5.x/mkdocs.yml"
  - Release Notes:
      - Stay Updated: about/subscribe.md
      - Lakekeeper (OSS): about/release-notes.md
      - Lakekeeper+: about/enterprise-release-notes.md
  - Community: support.md
  - About:
      - License: about/license.md
      - Code of Conduct: about/code-of-conduct.md
      - Logos: about/logos.md
  - Learn: /#learn

markdown_extensions:
  - toc:
      permalink: true
  - tables
  - markdown_grid_tables
  - pymdownx.snippets:
      # check_paths: True
      restrict_base_path: False
      base_path: .
  - md_in_html
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - attr_list
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

copyright: Copyright &copy; {year} <a href="https://lakekeeper.io">Lakekeeper</a>, Maintained by the <a href="/about/release-notes/#maintenance-team">Lakekeeper Team</a> at <a href="https://vakamo.com" target="_blank" rel="noopener noreferrer">Vakamo</a>.

hooks:
  - ../docs/hooks/env_key_wrap.py
  - ../docs/hooks/copyright_year.py
  - ../docs/hooks/llms_txt.py
  - ../docs/hooks/breadcrumbs.py

plugins:
  - monorepo
  - search
  # Only `latest` is searchable. Every version ships the same page titles, so
  # indexing more than one makes a single query return a near-identical hit per
  # version. Numbered snapshots and `nightly` stay fully browsable — this trims
  # the index only. Patterns are fnmatch against the search record's page path,
  # where `*` also matches `/`, so `docs/[0-9]*` covers every numbered release
  # without needing an entry per version.
  - exclude-search:
      exclude:
        - docs/[0-9]*
        - docs/nightly/*
      # Backstop: anything not reachable from the nav stays out of the index.
      exclude_unreferenced: true
  - autorefs

watch:
  - docs
  - versions
  - overrides

extra:
  social:
    - icon: fontawesome/brands/discord
      link: https://discord.gg/jkAGG8p93B
    - icon: fontawesome/brands/github
      link: https://github.com/lakekeeper/lakekeeper

# Site-wide CSS only. Home-page assets (bootstrap, fontawesome, animate,
# odometer, home.css, header.css + jQuery/WOW/odometer/main.js) are loaded
# exclusively by the landing page via overrides/home.html, so every other
# docs page stays light.
extra_css:
  - /assets/css/extra.css
