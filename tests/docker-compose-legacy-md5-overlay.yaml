services:
  minio:
    # Deliberately NOT pgsty/silo: this suite exercises the pre-CRC32 checksum
    # behaviour that `legacy-md5-behavior` exists for, and only a MinIO build
    # from before the CRC32 default reproduces it. Silo forked after that change,
    # so it cannot stand in here. MinIO no longer publishes images publicly;
    # bitnamilegacy carries MinIO RELEASE.2024-10-29T16-01-48Z, the last release
    # that still predates the checksum change. Its entrypoint needs the binary
    # named, and it runs as a non-root user that can write only below /bitnami.
    image: bitnamilegacy/minio:2024.10.29
    command: ["minio", "server", "--console-address", ":9001", "/bitnami/minio/data"]

  spark:
    environment:
      - LAKEKEEPER_TEST__S3_LEGACY_MD5_BEHAVIOR=1
