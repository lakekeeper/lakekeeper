name: integration test workflow

on:
  workflow_call:
    inputs:
      test_name:
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read # Needed to checkout code

jobs:
  test:
    name: ${{ inputs.test_name }}
    env:
      current_test: ${{ inputs.test_name }}
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      # Authenticated Docker Hub pulls avoid anonymous per-IP rate limits on
      # shared CI runners, which otherwise surface as image-pull connect
      # timeouts (registry-1.docker.io). Skipped when the secret is absent
      # (e.g. fork PRs) so those still run with anonymous pulls.
      - name: Login to Docker Hub
        if: ${{ env.DOCKERHUB_USERNAME != '' }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Restore binary
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: lakekeeper-image
          path: artifacts

      - name: Display structure of downloaded files
        run: ls -Rlh artifacts

      - name: Restore Docker image
        run: |
          docker load -i artifacts/lakekeeper-local-amd64.tar

      - name: Test ${{ inputs.test_name }}
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4
        with:
          max_attempts: 2
          timeout_minutes: 25
          # run.sh auto-selects the Spark image and docker-compose overlays
          # based on the test name / Iceberg version suffix.
          command: cd tests && bash run.sh ${current_test}
        env:
          LAKEKEEPER_TEST__SERVER_IMAGE: localhost/lakekeeper-local:amd64
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_STORAGE_ACCOUNT_NAME: ${{ secrets.AZURE_STORAGE_ACCOUNT_NAME }}
          AZURE_STORAGE_FILESYSTEM: ${{ secrets.AZURE_STORAGE_FILESYSTEM }}
          GCS_CREDENTIAL: ${{ secrets.GCS_CREDENTIAL }}
          GCS_BUCKET: ${{ secrets.GCS_BUCKET }}
          LAKEKEEPER_TEST__AWS_S3_BUCKET: ${{ secrets.LAKEKEEPER_TEST__AWS_S3_BUCKET }}
          LAKEKEEPER_TEST__AWS_S3_REGION: ${{ secrets.LAKEKEEPER_TEST__AWS_S3_REGION }}
          LAKEKEEPER_TEST__AWS_S3_ACCESS_KEY_ID: ${{ secrets.LAKEKEEPER_TEST__AWS_S3_ACCESS_KEY_ID }}
          LAKEKEEPER_TEST__AWS_S3_SECRET_ACCESS_KEY: ${{ secrets.LAKEKEEPER_TEST__AWS_S3_SECRET_ACCESS_KEY }}
          LAKEKEEPER_TEST__AWS_S3_STS_ROLE_ARN: ${{ secrets.LAKEKEEPER_TEST__AWS_S3_STS_ROLE_ARN }}
          LAKEKEEPER_TEST__AWS_KMS_S3_BUCKET: ${{ secrets.LAKEKEEPER_TEST__AWS_KMS_S3_BUCKET }}
          LAKEKEEPER_TEST__AWS_S3_KMS_ARN: ${{ secrets.LAKEKEEPER_TEST__AWS_S3_KMS_ARN }}
      # A debugging aid: a stuck dump must not hold the job, nor a failed one fail it.
      - name: Dump DB
        if: always()
        timeout-minutes: 5
        continue-on-error: true
        uses: tj-actions/pg-dump@f68d6b3b0a96a30fda60109a19a5d9fb3c536c9c
        with:
          database_url: "postgresql://postgres:postgres@localhost:31102/postgres"
          postgresql_version: "17"
          path: dump.sql
      - name: compress
        if: always() && hashFiles('dump.sql') != ''
        run: cat dump.sql | gzip -9 > dump.sql.gz
      - name: Upload dump
        if: always() && hashFiles('dump.sql.gz') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: db-dump-${{ inputs.test_name }}
          path: dump.sql.gz
      - name: Dump docker logs on failure
        if: always()
        uses: jwalton/gh-docker-logs@2741064ab9d7af54b0b1ffb6076cf64c16f0220e # v2.2.2
