name: Security audit

permissions:
  contents: read # Needed to checkout code

concurrency:
  group: ${{ github.repository }}-${{ github.head_ref || github.sha }}-${{ github.workflow }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
    paths:
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - ".cargo/deny.toml"

  pull_request:
    paths:
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - ".cargo/deny.toml"

  schedule:
    - cron: "17 6 * * *"

  # Run it on a branch to check a fix for an advisory before merging.
  workflow_dispatch:

jobs:
  # Bans, licenses and sources depend only on the dependency tree, so every PR checks them.
  cargo-deny:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@70f81531115945ba6eb6b941ec9d39d063438eb9 # v2.1.2
        with:
          command: check -s --hide-inclusion-graph bans licenses sources

  # New advisories appear without any change in this repository, so a PR checks them only
  # for a release. Main, the daily run and release PRs report them.
  advisories:
    if: github.event_name != 'pull_request' || startsWith(github.head_ref, 'release-please--')
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@70f81531115945ba6eb6b941ec9d39d063438eb9 # v2.1.2
        with:
          command: check -s --hide-inclusion-graph advisories
