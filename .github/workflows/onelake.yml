name: onelake tests

# OneLake (Microsoft Fabric) lives on an F2 capacity that is suspended when
# idle, so this suite resumes the capacity, runs, and suspends it again. It
# runs nightly instead of per-PR: the capacity bills per hour while active.
#
# The capacity is active only while tests run. The image and the Rust tests
# are built first, then a single job with both on its runner resumes the
# capacity, so neither the builds nor waiting for a runner is billed.

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

# The capacity is a single shared resource. Queue runs rather than letting one
# run's suspend cut another's tests short.
concurrency:
  group: onelake-capacity
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: 1.95.1
  CAPACITY_API_VERSION: "2023-11-01"
  NEXTEST_ARCHIVE: onelake-tests.tar.zst

jobs:
  docker:
    uses: ./.github/workflows/docker_build.yml
    with:
      platform: "amd64"
      # Run debug binary for debug_assertions
      dockerfile: "docker/full-debug.Dockerfile"
      image_name: "lakekeeper-local"

  rust-build:
    name: build rust onelake tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      # An empty `rustflags` keeps the action from exporting RUSTFLAGS, which
      # would replace `build.rustflags` from `.cargo/config.toml`, including the
      # `--cfg tracing_unstable` that `tracing::field::valuable` requires.
      - name: Setup Rust toolchain and cache
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          rustflags: ""
        env:
          RUST_CACHE_KEY_OS: rust-${{ env.RUST_TOOLCHAIN }}-cache-ubuntu-24.04

      - name: Setup cargo nextest
        uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2
        with:
          tool: cargo-nextest

      - name: Archive tests
        run: |
          cargo nextest archive --all-features -p lakekeeper --lib \
            --archive-file "${NEXTEST_ARCHIVE}"
        env:
          SQLX_OFFLINE: "true"
          # Keeps panic locations while shrinking the uploaded test binary.
          CARGO_PROFILE_DEV_DEBUG: line-tables-only

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: onelake-tests
          path: ${{ env.NEXTEST_ARCHIVE }}
          if-no-files-found: error
          retention-days: 1

  live-tests:
    name: onelake live tests
    needs: [docker, rust-build]
    runs-on: ubuntu-24.04
    environment: onelake-integration
    permissions:
      contents: read
      id-token: write # Needed for OIDC federation to Entra
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      CAP: ${{ vars.ONELAKE_CAPACITY_RESOURCE_ID }}
      LAKEKEEPER_TEST__ONELAKE_WORKSPACE_ID: ${{ vars.LAKEKEEPER_TEST__ONELAKE_WORKSPACE_ID }}
      LAKEKEEPER_TEST__ONELAKE_LAKEHOUSE_ID: ${{ vars.LAKEKEEPER_TEST__ONELAKE_LAKEHOUSE_ID }}
      LAKEKEEPER_TEST__ONELAKE_REGION: ${{ vars.LAKEKEEPER_TEST__ONELAKE_REGION }}
      LAKEKEEPER_TEST__ONELAKE_CLIENT_ID: ${{ vars.LAKEKEEPER_TEST__ONELAKE_CLIENT_ID }}
      LAKEKEEPER_TEST__ONELAKE_TENANT_ID: ${{ vars.LAKEKEEPER_TEST__ONELAKE_TENANT_ID }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup cargo nextest
        uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2
        with:
          tool: cargo-nextest

      # Authenticated Docker Hub pulls avoid anonymous per-IP rate limits on
      # shared CI runners, which otherwise surface as image-pull connect
      # timeouts (registry-1.docker.io).
      - name: Login to Docker Hub
        if: ${{ env.DOCKERHUB_USERNAME != '' }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Restore binary
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: lakekeeper-image
          path: artifacts

      - name: Restore Docker image
        run: docker load -i artifacts/lakekeeper-local-amd64.tar

      - name: Restore Rust tests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: onelake-tests

      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.ONELAKE_CAPACITY_CLIENT_ID }}
          tenant-id: ${{ vars.LAKEKEEPER_TEST__ONELAKE_TENANT_ID }}
          subscription-id: ${{ vars.ONELAKE_CAPACITY_SUBSCRIPTION_ID }}

      # Billing starts here: everything the suites need is on this runner.
      - name: Resume capacity
        id: resume
        run: .github/scripts/fabric-capacity.sh resume

      # The live tests are `#[ignore]`, and the default nextest profile filters
      # the module out entirely, so opt into both. The `ci` profile carries
      # `default-filter = all()`.
      - name: Test rust
        run: |
          cargo nextest run --archive-file "${NEXTEST_ARCHIVE}" --workspace-remap . \
            --profile ci --run-ignored=all -E 'test(::onelake_integration_tests::)'
        env:
          LAKEKEEPER_TEST__ONELAKE_CLIENT_SECRET: ${{ secrets.LAKEKEEPER_TEST__ONELAKE_CLIENT_SECRET }}

      # Runs after a Rust failure too, while the capacity is up anyway.
      - name: Test spark_onelake-1.10.1
        if: ${{ !cancelled() && steps.resume.outcome == 'success' }}
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4
        with:
          max_attempts: 2
          timeout_minutes: 25
          command: cd tests && bash run.sh spark_onelake-1.10.1
        env:
          LAKEKEEPER_TEST__SERVER_IMAGE: localhost/lakekeeper-local:amd64
          LAKEKEEPER_TEST__ONELAKE_CLIENT_SECRET: ${{ secrets.LAKEKEEPER_TEST__ONELAKE_CLIENT_SECRET }}
          LAKEKEEPER_TEST__ONELAKE_ENDPOINT_MODE: default,regional

      # A fresh token: the first may have expired during the suites.
      - name: Log in to Azure for suspend
        if: always()
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.ONELAKE_CAPACITY_CLIENT_ID }}
          tenant-id: ${{ vars.LAKEKEEPER_TEST__ONELAKE_TENANT_ID }}
          subscription-id: ${{ vars.ONELAKE_CAPACITY_SUBSCRIPTION_ID }}

      # Runs when the tests fail or are cancelled too: an active capacity bills
      # by the hour.
      - name: Suspend capacity
        if: always()
        run: .github/scripts/fabric-capacity.sh suspend

  # Backstop for a live-tests job that ended before its own suspend step, such
  # as a lost runner. A no-op once the capacity is paused. The daily automation
  # runbook covers the case where this job never runs either.
  suspend:
    name: suspend capacity
    needs: live-tests
    if: always()
    runs-on: ubuntu-24.04
    environment: onelake-integration
    permissions:
      contents: read
      id-token: write # Needed for OIDC federation to Entra
    env:
      CAP: ${{ vars.ONELAKE_CAPACITY_RESOURCE_ID }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts

      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.ONELAKE_CAPACITY_CLIENT_ID }}
          tenant-id: ${{ vars.LAKEKEEPER_TEST__ONELAKE_TENANT_ID }}
          subscription-id: ${{ vars.ONELAKE_CAPACITY_SUBSCRIPTION_ID }}

      - name: Suspend
        run: .github/scripts/fabric-capacity.sh suspend
