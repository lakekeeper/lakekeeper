name: Unittests

on:
  push:
    branches:
      - main
      - "manual-release-*"
      - "rel-*"
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: 1.94.1
  RUSTFLAGS: --cfg tracing_unstable -D warnings

permissions:
  contents: read # Needed to checkout code
  checks: write # Needed for test reporting

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  tests-pass:
    name: all tests pass
    runs-on: ubuntu-latest
    needs:
      - sqlx-check
      - check-format
      - clippy
      - check-generated-openapi-matches
      - test
      - msrv-check
      - unused-deps
      - check-audit-format-callout
    steps:
      - run: exit 0

  msrv-check:
    name: MSRV check
    runs-on: ubuntu-24.04
    env:
      RUSTFLAGS: --cfg tracing_unstable --cfg tokio_unstable # drop -D warnings; MSRV builds may emit new warnings
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - name: Read MSRV from Cargo.toml
        id: msrv
        run: |
          python3 -c "
          import tomllib, pathlib, sys
          cargo = tomllib.loads(pathlib.Path('Cargo.toml').read_text())
          v = cargo.get('workspace', {}).get('package', {}).get('rust-version') \
              or cargo.get('package', {}).get('rust-version')
          if not v:
              print('::error::rust-version not found in Cargo.toml')
              sys.exit(1)
          print(f'version={v}')
          " >> "$GITHUB_OUTPUT"
      - name: Setup Rust ${{ steps.msrv.outputs.version }}
        uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
        env:
          RUST_CACHE_KEY_OS: rust-msrv-${{ steps.msrv.outputs.version }}-cache-ubuntu-24.04
      - name: cargo check
        run: cargo check --workspace
        env:
          SQLX_OFFLINE: "true"

  unused-deps:
    name: Unused dependencies
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: Install cargo-machete
        uses: taiki-e/install-action@fd2f5e3d644b484055ebf4268f474c565f148f25 # v2
        with:
          tool: cargo-machete
      - name: Check unused dependencies
        run: cargo machete

  sqlx-check:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: Install sqlx-cli and migrate database
        run: |
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update && sudo apt-get install -yqq libpq-dev --no-install-recommends
          cargo install -q --version=0.8.2 sqlx-cli --no-default-features --features postgres
          sqlx database create
          sqlx migrate run --source crates/lakekeeper-storage-postgres/migrations
      - name: Cargo sqlx-check
        # Exclude lakekeeper-bin so --all-features doesn't enable `ui` (pulls
        # the `lakekeeper-console` git dep); it has no sqlx::query! macros.
        # Must match `just sqlx-prepare` invocation.
        run: cargo sqlx prepare --check --workspace -- --workspace --exclude lakekeeper-bin --all-features

  check-format:
    runs-on: ubuntu-24.04
    steps:
      - run: sudo snap install --edge --classic just
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Setup Rust toolchain and cache
        uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1
        with:
          components: rustfmt
          toolchain: ${{ env.RUST_TOOLCHAIN }},nightly
        env:
          RUST_CACHE_KEY_OS: rust-${{ env.RUST_TOOLCHAIN }}-cache-ubuntu-24.04

      - name: Cargo format
        run: just check-format

      - name: Check diff
        run: git diff --exit-code

  clippy:
    runs-on: ubuntu-24.04
    steps:
      - run: |
          sudo snap install --edge --classic just

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Setup Rust toolchain and cache
        uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1
        with:
          components: clippy
          toolchain: ${{ env.RUST_TOOLCHAIN }}
        env:
          RUST_CACHE_KEY_OS: rust-${{ env.RUST_TOOLCHAIN }}-cache-ubuntu-24.04

      - name: Cargo clippy
        run: just check-clippy
        env:
          RUST_CACHE_KEY_OS: rust-${{ env.RUST_TOOLCHAIN }}-cache-ubuntu-24.04

  check-generated-openapi-matches:
    runs-on: ubuntu-24.04
    steps:
      - run: |
          sudo snap install --edge --classic just
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - name: Setup Rust toolchain and cache
        uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1
        with:
          components: clippy
          toolchain: ${{ env.RUST_TOOLCHAIN }}
        env:
          RUST_CACHE_KEY_OS: rust-${{ env.RUST_TOOLCHAIN }}-cache-ubuntu-24.04
      - name: Regenerate management openapi
        run: just update-management-openapi
      - name: Regenerate generic-table openapi
        run: just update-generic-table-openapi
      - name: Fail on diff
        run: git diff -I ".*version.*" -w --ignore-blank-lines --exit-code Cargo.lock docs/docs/api/
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24
      - name: Build TS Client
        # Pin both the generator and typescript: typescript 7.x (native rewrite)
        # dropped ts.SyntaxKind, which openapi-ts relies on, and the tool's dep
        # range would otherwise float to it and crash codegen.
        run: npx -p @hey-api/openapi-ts@0.98.2 -p typescript@5.9.3 openapi-ts -i docs/docs/api/management-open-api.yaml -o src/gen/management -c @hey-api/client-fetch
      - name: Build TS Client (generic tables)
        run: npx -p @hey-api/openapi-ts@0.98.2 -p typescript@5.9.3 openapi-ts -i docs/docs/api/generic-table-open-api.yaml -o src/gen/generic-tables -c @hey-api/client-fetch
      # Smoke-test the generator the downstream SDKs actually use. hey-api above
      # exercises a different code path and has repeatedly been happy with specs
      # openapi-generator rejects. This asserts only that generation succeeds —
      # whether the emitted client behaves correctly is covered by the SDK repos.
      # Pinned to the version go-lakekeeper generates with.
      - name: Generate clients with openapi-generator
        run: |
          for spec in management-open-api generic-table-open-api; do
            for lang in go python typescript-fetch; do
              echo "=== $spec -> $lang"
              docker run --rm -v "$PWD:/local" \
                openapitools/openapi-generator-cli:v7.10.0 generate \
                -i "/local/docs/docs/api/$spec.yaml" -g "$lang" -o "/local/target/openapi-smoke/$spec-$lang" \
                --global-property=apiDocs=false,apiTests=false,modelDocs=false,modelTests=false
            done
          done

  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        postgres-version: ["15", "18"]
    services:
      vault:
        # Recent vault images run as non-root and hard-require IPC_LOCK; the
        # old SKIP_SETCAP escape hatch is now ignored. Granting the capability
        # via `options: --cap-add IPC_LOCK` is the supported workaround. Pin
        # to a specific patch so an image refresh can't break CI again.
        image: hashicorp/vault:1.21.4
        ports:
          - 8200:8200
        env:
          VAULT_DEV_ROOT_TOKEN_ID: myroot
          VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
        options: >-
          --cap-add IPC_LOCK
          --health-cmd "vault status -address http://localhost:8200"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      postgres:
        image: postgres:${{ matrix.postgres-version }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      RUSTFLAGS: --cfg tracing_unstable -D warnings -C debuginfo=0
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      GCS_CREDENTIAL: ${{ secrets.GCS_CREDENTIAL }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Start Minio Docker Container
        run: |
          docker run -d --name minio -p 9000:9000 -p 9001:9001 \
            -e "MINIO_ROOT_USER=minio-root-user" \
            -e "MINIO_ROOT_PASSWORD=minio-root-password" \
            minio/minio:RELEASE.2025-07-23T15-54-02Z server --console-address ":9001" /data

      - name: Wait for Minio to be healthy
        shell: bash
        run: |
          for i in {1..10}; do
            if curl -I http://localhost:9000/minio/health/live; then
              echo "Minio is healthy"
              exit 0
            else
              echo "Waiting for Minio to be healthy..."
              sleep 5
            fi
          done
          echo "Minio did not become healthy in time"
          exit 1

      - name: Create Minio Bucket
        run: |
          docker exec minio /usr/bin/mc alias set local http://localhost:9000 minio-root-user minio-root-password
          docker exec minio /usr/bin/mc mb local/tests

      - uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # v3.0.0
        if: ${{ env.AZURE_CLIENT_ID != '' }}
        with:
          creds: '{"clientId":"${{ secrets.AZURE_CLIENT_ID }}","clientSecret":"${{ secrets.AZURE_CLIENT_SECRET }}","tenantId":"${{ secrets.AZURE_TENANT_ID }}"}'
          allow-no-subscriptions: true

      - name: Write gcp credential to file
        if: ${{ env.GCS_CREDENTIAL != '' }}
        run: echo '${{ secrets.GCS_CREDENTIAL }}' > /tmp/gcs.json
        shell: bash

      - name: Setup Rust toolchain and cache
        uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
        env:
          RUST_CACHE_KEY_OS: rust-${{ env.RUST_TOOLCHAIN }}-cache-ubuntu-24.04

      - name: Setup cargo nextest
        uses: taiki-e/install-action@fd2f5e3d644b484055ebf4268f474c565f148f25 # v2
        with:
          tool: cargo-nextest

      - name: Determine nextest profile
        run: |
          if [[ "${{ github.event.pull_request.head.repo.full_name }}" == "${{ github.repository }}" ]]; then
            # PR is made off this repo, so workflows have access to secrets and the entire suite
            # can be run.
            echo "NEXTEST_PROFILE=ci" >> $GITHUB_ENV
          else
            # PR is made off a fork, so secrets are not available in ci workflows.
            echo "NEXTEST_PROFILE=ci_no_secrets" >> $GITHUB_ENV
          fi

      - name: Migrate database
        run: |
          export DEBIAN_FRONTEND=noninteractive 
          sudo apt-get update && sudo apt-get install -yqq libpq-dev --no-install-recommends
          cargo install -q --version=0.8.2 sqlx-cli --no-default-features --features postgres
          sqlx database create
          sqlx migrate run --source crates/lakekeeper-storage-postgres/migrations
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres

      - name: Setup vault
        run: |
          export VAULT_ADDR=http://localhost:8200
          export DEBIAN_FRONTEND=noninteractive 
          sudo apt update && sudo apt install gpg wget
          wget -O- https://apt.releases.hashicorp.com/gpg | sudo gpg --dearmor -o /usr/share/keyrings/hashicorp-archive-keyring.gpg
          gpg --no-default-keyring --keyring /usr/share/keyrings/hashicorp-archive-keyring.gpg --fingerprint
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] https://apt.releases.hashicorp.com $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/hashicorp.list
          sudo apt update && sudo apt install vault

          vault login -address "${VAULT_ADDR}" myroot
          vault auth  enable -address "${VAULT_ADDR}"  userpass
          echo "path \"secret/*\" { capabilities = [\"create\", \"read\", \"update\", \"delete\", \"list\"] }" > /tmp/app.hcl
          vault policy write -address "${VAULT_ADDR}" app /tmp/app.hcl
          vault write -address "${VAULT_ADDR}" auth/userpass/users/test password=test policies=app

      - name: Setup openfga
        # v1.11+ required: reconcile/rebuild calls write_with_options(idempotent),
        # which relies on the on_duplicate/on_missing fields added in v1.11.
        run: docker run -d -p 35081:8081 openfga/openfga:v1.14 run

      - name: Test
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4
        with:
          max_attempts: 2
          timeout_minutes: 25
          command: cargo nextest run --profile ${{ env.NEXTEST_PROFILE }} --all-targets --all-features --workspace
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
          LAKEKEEPER_TEST__KV2__URL: http://localhost:8200
          LAKEKEEPER_TEST__KV2__USER: test
          LAKEKEEPER_TEST__KV2__PASSWORD: test
          LAKEKEEPER_TEST__KV2__SECRET_MOUNT: secret
          # minio test envs
          LAKEKEEPER_TEST__S3_BUCKET: tests
          LAKEKEEPER_TEST__S3_REGION: local
          LAKEKEEPER_TEST__S3_ACCESS_KEY: minio-root-user
          LAKEKEEPER_TEST__S3_SECRET_KEY: minio-root-password
          LAKEKEEPER_TEST__S3_ENDPOINT: http://localhost:9000

          LAKEKEEPER_TEST__ENABLE_AZURE_SYSTEM_CREDENTIALS: true
          LAKEKEEPER_TEST__ENABLE_GCP_SYSTEM_CREDENTIALS: true

          LAKEKEEPER_TEST__OPENFGA__ENDPOINT: http://localhost:35081
          # The lakekeeper-integration-tests OpenFGA e2e harness links authz-openfga
          # as a NON-test dependency, so it reads the `LAKEKEEPER__` config prefix
          # (not `LAKEKEEPER_TEST__`, which only applies to authz-openfga's own
          # cfg(test) builds). Point both at the same store.
          LAKEKEEPER__OPENFGA__ENDPOINT: http://localhost:35081
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/gcs.json

          LAKEKEEPER_TEST__AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          LAKEKEEPER_TEST__AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          LAKEKEEPER_TEST__AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          LAKEKEEPER_TEST__AZURE_STORAGE_ACCOUNT_NAME: ${{ secrets.AZURE_STORAGE_ACCOUNT_NAME }}
          LAKEKEEPER_TEST__AZURE_STORAGE_FILESYSTEM: ${{ secrets.AZURE_STORAGE_FILESYSTEM }}
          LAKEKEEPER_TEST__AZURE_STORAGE_SHARED_KEY: ${{ secrets.AZURE_STORAGE_SHARED_KEY }}

          LAKEKEEPER_TEST__AWS_S3_BUCKET: ${{ secrets.LAKEKEEPER_TEST__AWS_S3_BUCKET }}
          LAKEKEEPER_TEST__AWS_S3_REGION: ${{ secrets.LAKEKEEPER_TEST__AWS_S3_REGION }}
          LAKEKEEPER_TEST__AWS_S3_ACCESS_KEY_ID: ${{ secrets.LAKEKEEPER_TEST__AWS_S3_ACCESS_KEY_ID }}
          LAKEKEEPER_TEST__AWS_S3_SECRET_ACCESS_KEY: ${{ secrets.LAKEKEEPER_TEST__AWS_S3_SECRET_ACCESS_KEY }}
          LAKEKEEPER_TEST__AWS_S3_STS_ROLE_ARN: ${{ secrets.LAKEKEEPER_TEST__AWS_S3_STS_ROLE_ARN }}
          LAKEKEEPER_TEST__AWS_KMS_S3_BUCKET: ${{ secrets.LAKEKEEPER_TEST__AWS_KMS_S3_BUCKET }}
          LAKEKEEPER_TEST__AWS_S3_KMS_ARN: ${{ secrets.LAKEKEEPER_TEST__AWS_S3_KMS_ARN }}

          TEST_R2: ${{ secrets.TEST_R2 }}
          LAKEKEEPER_TEST__R2_BUCKET: ${{ secrets.LAKEKEEPER_TEST__R2_BUCKET }}
          LAKEKEEPER_TEST__R2_TOKEN: ${{ secrets.LAKEKEEPER_TEST__R2_TOKEN }}
          LAKEKEEPER_TEST__R2_SECRET_ACCESS_KEY: ${{ secrets.LAKEKEEPER_TEST__R2_SECRET_ACCESS_KEY }}
          LAKEKEEPER_TEST__R2_ACCESS_KEY_ID: ${{ secrets.LAKEKEEPER_TEST__R2_ACCESS_KEY_ID }}
          LAKEKEEPER_TEST__R2_ACCOUNT_ID: ${{ secrets.LAKEKEEPER_TEST__R2_ACCOUNT_ID }}
          LAKEKEEPER_TEST__R2_ENDPOINT: ${{ secrets.LAKEKEEPER_TEST__R2_ENDPOINT }}

          LAKEKEEPER_TEST__OSS_BUCKET: ${{ secrets.LAKEKEEPER_TEST__OSS_BUCKET }}
          LAKEKEEPER_TEST__OSS_REGION: ${{ secrets.LAKEKEEPER_TEST__OSS_REGION }}
          LAKEKEEPER_TEST__OSS_ENDPOINT: ${{ secrets.LAKEKEEPER_TEST__OSS_ENDPOINT }}
          LAKEKEEPER_TEST__OSS_ACCESS_KEY_ID: ${{ secrets.LAKEKEEPER_TEST__OSS_ACCESS_KEY_ID }}
          LAKEKEEPER_TEST__OSS_SECRET_ACCESS_KEY: ${{ secrets.LAKEKEEPER_TEST__OSS_SECRET_ACCESS_KEY }}
          LAKEKEEPER_TEST__OSS_STS_ROLE_ARN: ${{ secrets.LAKEKEEPER_TEST__OSS_STS_ROLE_ARN }}

          # Only the secret key is a credential; the rest are repo variables.
          # _ENDPOINT is the interim dataplatform grid, the only STACKIT storage
          # with an STS endpoint until object.storage reaches StorageGRID 12.0.
          LAKEKEEPER_TEST__STACKIT_BUCKET: ${{ vars.LAKEKEEPER_TEST__STACKIT_BUCKET }}
          LAKEKEEPER_TEST__STACKIT_REGION: ${{ vars.LAKEKEEPER_TEST__STACKIT_REGION }}
          LAKEKEEPER_TEST__STACKIT_ENDPOINT: ${{ vars.LAKEKEEPER_TEST__STACKIT_ENDPOINT }}
          LAKEKEEPER_TEST__STACKIT_ACCESS_KEY_ID: ${{ vars.LAKEKEEPER_TEST__STACKIT_ACCESS_KEY_ID }}
          LAKEKEEPER_TEST__STACKIT_SECRET_ACCESS_KEY: ${{ secrets.LAKEKEEPER_TEST__STACKIT_SECRET_ACCESS_KEY }}
          LAKEKEEPER_TEST__STACKIT_CREDENTIALS_GROUP_URN: ${{ vars.LAKEKEEPER_TEST__STACKIT_CREDENTIALS_GROUP_URN }}

          LAKEKEEPER_TEST__GCS_BUCKET: ${{ secrets.GCS_BUCKET }}
          LAKEKEEPER_TEST__GCS_HNS_BUCKET: ${{ secrets.GCS_HNS_BUCKET }}
          LAKEKEEPER_TEST__GCS_CREDENTIAL: ${{ secrets.GCS_CREDENTIAL }}
      - name: Upload junit
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: junit-pg${{ matrix.postgres-version }}
          path: target/nextest/${{ env.NEXTEST_PROFILE }}/junit.xml
      - name: Doc Test
        run: cargo test --no-fail-fast --doc --all-features --workspace
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres

  check-audit-format-callout:
    name: audit format change is called out
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      # For the `gh api` read of the pull request title and body below. The workflow-level
      # block grants only `contents` and `checks`.
      pull-requests: read
    # Only a pull request has a title and body to inspect; this workflow also runs on
    # pushes and manual dispatches, where there is nothing to gate. The condition sits
    # on the steps rather than on the job: a skipped job skips everything that `needs`
    # it, which would stop `tests-pass` reporting on pushes to main. With no job-level
    # condition the job runs, does nothing, and succeeds.
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        if: github.event_name == 'pull_request'
        with:
          persist-credentials: false
          # The base commit has to be present to diff against it. The default shallow
          # fetch does not include it.
          fetch-depth: 0
      - name: Check the audit format version bump matches the change
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python3 .github/scripts/check-audit-format-bump.py "${BASE_SHA}"
      - name: Self-test the version bump checker
        if: github.event_name == 'pull_request'
        run: python3 .github/scripts/check-audit-format-bump.py --self-test
      - name: Audit records are emitted from one site that stamps the version
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail

          # Every audit record must go through `__audit_emit!`, which stamps
          # `audit_format`. Counted tree-wide: the macro is `#[macro_export]`ed and
          # `tracing::info!` is callable anywhere, so a second site can appear in any
          # crate. Comments are skipped — the AUDIT_FORMAT docs quote both needles.
          hits() { git grep -nE "$1" -- '*.rs' | grep -vE ':[0-9]+:[[:space:]]*//' || true; }

          EMISSIONS="$(hits 'event_source[[:space:]]*=[[:space:]]*"audit"')"
          STAMPS="$(hits 'audit_format[[:space:]]*=')"
          N_EMISSIONS="$(printf '%s' "${EMISSIONS}" | grep -c . || true)"
          N_STAMPS="$(printf '%s' "${STAMPS}" | grep -c . || true)"

          STATUS=0
          if [ "${N_EMISSIONS}" -ne 1 ]; then
            echo "::error::expected exactly one place that emits \`event_source = \"audit\"\`, found ${N_EMISSIONS}. Route every audit record through \`__audit_emit!\`, which is what stamps \`audit_format\`; a second site can silently omit the version."
            printf '%s\n' "${EMISSIONS}" >&2
            STATUS=1
          fi
          if [ "${N_STAMPS}" -ne 1 ]; then
            echo "::error::expected exactly one place that sets \`audit_format\`, found ${N_STAMPS}."
            printf '%s\n' "${STAMPS}" >&2
            STATUS=1
          fi
          exit "${STATUS}"
      - name: Require a release-notes callout when the audit log format changes
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # Read via `gh api`, not `github.event`: that payload is frozen at the triggering
          # event, and a description edit fires no event and is not re-read on a re-run.
          # Kept in shell variables, never interpolated through `${{ }}` — a title or body
          # is attacker-controlled text and substitution would splice it into the shell.
          PR="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")"
          PR_TITLE="$(printf '%s' "${PR}" | jq -r '.title // ""')"
          PR_BODY="$(printf '%s' "${PR}" | jq -r '.body // ""')"

          AUDIT_DIR=crates/lakekeeper/src/service/events/backends/audit

          # Three-dot so the comparison starts at the merge base: unrelated movement on
          # the base branch must not trip this gate.
          # Read the declared version at each end and compare the values, rather than
          # grepping a diff for the constant. A diff limited to a path cannot pair the
          # old and new file when the module moves, so the whole file reads as added and
          # the version reads as changed when it did not. Searching the tree at each
          # revision does not care where the constant lives.
          #
          # The version lookup lives in the checker script, which errors when more than
          # one file declares the constant. A second implementation here was a second
          # thing to get wrong: it took the first match and could not see a duplicate.
          declared_version() {
            python3 .github/scripts/check-audit-format-bump.py --print-version "$1"
          }
          # Compare against the MERGE BASE, not against the base branch tip. The tip
          # moves while a pull request is open, so reading the version there can report a
          # change that came from the base branch rather than from this branch. The
          # fixture comparison below already uses the merge base via three-dot syntax;
          # this makes both look at the same point.
          MERGE_BASE="$(git merge-base "${BASE_SHA}" HEAD)"
          echo "Comparing against merge base ${MERGE_BASE} (base branch tip is ${BASE_SHA})."
          BASE_VERSION="$(declared_version "${MERGE_BASE}")"
          HEAD_VERSION="$(declared_version HEAD)"

          if [ "${BASE_VERSION}" != "${HEAD_VERSION}" ]; then
            VERSION_CHANGED=true
          else
            VERSION_CHANGED=false
          fi

          # A change to the MAJOR half breaks existing consumers, so it has a stricter
          # requirement below. An empty BASE_VERSION means the field is being introduced,
          # which declares a format rather than breaking one.
          BASE_MAJOR="${BASE_VERSION%%.*}"
          HEAD_MAJOR="${HEAD_VERSION%%.*}"
          if [ -n "${BASE_VERSION}" ] && [ "${BASE_MAJOR}" != "${HEAD_MAJOR}" ]; then
            MAJOR_CHANGED=true
          else
            MAJOR_CHANGED=false
          fi

          if [ -n "$(git diff --name-only "${MERGE_BASE}" HEAD -- "${AUDIT_DIR}/fixtures/")" ]; then
            FIXTURES_CHANGED=true
          else
            FIXTURES_CHANGED=false
          fi

          if [ "${VERSION_CHANGED}" = false ] && [ "${FIXTURES_CHANGED}" = false ]; then
            echo "Audit log format untouched — nothing to call out."
            exit 0
          fi

          echo "Audit log format change detected. Declared version: '${BASE_VERSION}' -> '${HEAD_VERSION}' (changed: ${VERSION_CHANGED}); fixtures changed: ${FIXTURES_CHANGED}."

          # A "## Release notes" section with something under it. The heading on its own
          # is not a release note, so an empty section must not satisfy the requirement.
          # `tolower` rather than a case-insensitive match, which is not portable across
          # awk implementations.
          #
          # The terminator is `^##[^#]`, not `^##[[:space:]]*[^[:space:]]`: the latter also
          # matches `###`, because the star matches zero spaces and the negated class then
          # eats the third `#`. A section whose first line is a `### Breaking changes`
          # subheading — the shape release-please uses, and the shape a major bump invites —
          # would read as empty and block the very pull request that must not be blocked.
          RELEASE_NOTES=$(printf '%s\n' "${PR_BODY:-}" | awk '
            tolower($0) ~ /^##[[:space:]]*release notes/ { inside = 1; next }
            /^##[^#]/ { inside = 0 }
            inside && $0 ~ /[^[:space:]]/ { found = 1 }
            END { print (found ? "yes" : "no") }
          ')

          if [ "${MAJOR_CHANGED}" = true ]; then
            if [ "${RELEASE_NOTES}" = yes ]; then
              echo "Major version change, and the body has release notes. OK."
              exit 0
            fi
            echo "::error::The audit log format changed incompatibly (major version ${BASE_MAJOR} -> ${HEAD_MAJOR}) and the pull request body has no release notes."
            cat >&2 <<'MAJOR_MESSAGE'

          The MAJOR half of AUDIT_FORMAT changed, which means existing consumers of the
          audit log will break. A mention in the pull request title is not enough here:
          add a "## Release notes" section to the body saying, in consumer terms, which
          field moved and what a parser has to do about it.

          A consumer that discovers a breaking format change from a parse failure in
          production has been let down.

          See the audit log section of docs/docs/developer-guide.md.
          MAJOR_MESSAGE
            exit 1
          fi

          # Additive or otherwise non-breaking: either signal is enough. A title naming
          # the audit log is what the release notes are summarised from; an explicit
          # section says it outright.
          if printf '%s' "${PR_TITLE:-}" | grep -i 'audit' >/dev/null; then
            echo "Pull request title mentions the audit log. OK."
            exit 0
          fi
          if [ "${RELEASE_NOTES}" = yes ]; then
            echo "Pull request body has release notes. OK."
            exit 0
          fi

          echo "::error::This pull request changes the audit log format but does not say so where a consumer would see it."
          cat >&2 <<'MESSAGE'

          This pull request changes the audit log wire format: it edits AUDIT_FORMAT,
          the committed fixtures, or both. Operators parse these records, so a format
          change has to be visible in the release notes rather than only in the diff.

          Do one of the following:

            * mention the audit log in the pull request title, e.g.
              "feat(audit): record the request id on authorization events" — release
              notes are summarised from pull request titles; or

            * add a "## Release notes" section to the pull request body describing the
              change in consumer terms: which field moved, and what a parser must do
              about it.

          If you bumped the major half of AUDIT_FORMAT, the release notes are not
          optional: a consumer that discovers a breaking format change from a parse
          failure in production has been let down.

          See the audit log section of docs/docs/developer-guide.md.
          MESSAGE
          exit 1
