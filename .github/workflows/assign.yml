name: Assign issue from comment

on:
  issue_comment:
    types:
      - created

permissions:
  issues: write

jobs:
  assign:
    if: ${{ !github.event.issue.pull_request && github.event.comment.body == '/assign' }}
    runs-on: ubuntu-latest
    steps:
      - name: Assign issue to commenter
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const issueRequest = {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            };
            const { data: issue } = await github.rest.issues.get(issueRequest);

            if (issue.state !== 'open' || issue.assignees.length !== 0) {
              core.info(`Issue #${issue.number} is not available for self-assignment.`);
              return;
            }

            await github.rest.issues.addAssignees({
              ...issueRequest,
              assignees: [context.payload.comment.user.login],
            });
