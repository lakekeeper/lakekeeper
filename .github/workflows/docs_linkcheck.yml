name: Docs Link & SEO Check

on:
  push:
    branches:
      - main
      - "manual-release-*"
      - "rel-*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read # Needed to checkout code

jobs:
  linkcheck:
    name: Link & SEO Check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: 3.x
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: 1.x
      - uses: taiki-e/install-action@25f51f6b1bf4e18876107cece836f4f77ac17c8c # v2
        with:
          tool: lychee
      # `just linkcheck` builds the site, checks anchors and links, and then
      # runs `just seo-check` over the same build (sitemap, canonicals,
      # noindex on duplicate version trees, Open Graph, llms.txt/robots.txt).
      - name: Link check (nightly anchors + assembled-site files) and SEO check
        run: just linkcheck
        working-directory: ./site
