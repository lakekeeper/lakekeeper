name: Test Lakekeeper migrations

# Called by integration.yml, which builds the `lakekeeper-image` artifact.
on:
  workflow_call:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read  # Needed to checkout code

jobs:
  define-initial-versions:
    runs-on: ubuntu-latest
    outputs:
      initial-versions: ${{ steps.initial-versions.outputs.initial-versions }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
          # initial_versions.py reads the release tags in the history of HEAD.
          fetch-depth: 0
      - name: Get initial versions
        id: initial-versions
        run: |
          cd tests/migrations
          python3 initial_versions.py >> "$GITHUB_OUTPUT"

  test-migration:
    strategy:
      fail-fast: false
      matrix:
        initial_version: ${{ fromJSON(needs.define-initial-versions.outputs.initial-versions) }}
        delete_profile:
          - default
          - soft-delete-1sec
          - soft-delete-1week
    needs:
      - define-initial-versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      - name: Restore binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: lakekeeper-image
          path: artifacts

      - name: Display structure of downloaded files
        run: ls -Rlh artifacts

      - name: Restore Docker image
        run: |
          docker load -i artifacts/lakekeeper-local-amd64.tar

      - name: Test migration
        run: |
          cd tests/migrations
          just test_migration \
            quay.io/lakekeeper/catalog:${{ matrix.initial_version }} \
            './create-warehouse/${{ matrix.delete_profile }}.json'
      - name: Dump docker logs on failure
        if: failure()
        uses: jwalton/gh-docker-logs@2741064ab9d7af54b0b1ffb6076cf64c16f0220e # v2.2.2
